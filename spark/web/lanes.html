<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>SPARK: Lanes</title>
    <style>
      :root {
        --bg: #0e1116;
        --line: #2a3340;
        --ink: #e8edf2;
        --dim: #93a1b0;
        --amber: #f4b740;
        --blue: #4f9ad6;
        --good: #57d98a;
        --bad: #ff6b6b;
        /* board card sized to fit BOTH lane width and board height -> never scrolls.
           px cap keeps cards inside the lane on wide (desktop) viewports. */
        --cw: min(33vw, 11.5vh, 150px);
        --hw: 82px; /* hand card width (overlapping fan) */
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(
          120% 80% at 50% 0%,
          #16202b 0%,
          var(--bg) 70%
        );
        color: var(--ink);
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        position: relative;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      .btn {
        background: #1c2530;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 700;
        font-size: 13px;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .btn.primary {
        background: linear-gradient(180deg, #f4b740, #c98f1c);
        color: #241a05;
        border: none;
      }

      /* top bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: #0c0f14;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 1px;
        font-size: 15px;
        background: linear-gradient(90deg, var(--amber), #ffe29a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        white-space: nowrap;
      }
      .turn {
        color: var(--dim);
        font-size: 12px;
      }
      .timer {
        font-weight: 800;
        font-size: 13px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        min-width: 40px;
        letter-spacing: 0.3px;
      }
      .timer.low {
        color: var(--bad);
        animation: pulse 1s infinite;
      }
      .record {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 800;
        font-size: 13px;
        margin-left: auto;
      }
      .flag {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        background: #1c2530;
        border: 1px solid var(--line);
      }
      .flag.you {
        background: #183a26;
        border-color: var(--good);
        color: var(--good);
      }
      .flag.foe {
        background: #3a1a1a;
        border-color: var(--bad);
        color: var(--bad);
      }
      .newbtn {
        font-size: 11px;
        padding: 5px 9px;
      }

      /* lanes fill all remaining space */
      .lanes {
        flex: 1;
        display: flex;
        gap: 5px;
        padding: 5px;
        min-height: 0;
        align-items: stretch;
        overflow: hidden;
      }
      .lane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          #ff6b6b10,
          transparent 34%,
          transparent 66%,
          #57d98a12
        );
        border: 1px solid #1f2733;
        transition: box-shadow 0.25s;
      }
      .lane.win-you {
        box-shadow: inset 0 0 0 1.5px #57d98a66;
      }
      .lane.win-foe {
        box-shadow: inset 0 0 0 1.5px #ff6b6b66;
      }
      .lane.scored-you {
        animation: scoreYou 0.6s ease;
      }
      .lane.scored-foe {
        animation: scoreFoe 0.6s ease;
      }
      @keyframes scoreYou {
        40% {
          box-shadow:
            inset 0 0 0 3px #57d98a,
            0 0 20px #57d98a99;
          background: #57d98a22;
        }
      }
      @keyframes scoreFoe {
        40% {
          box-shadow:
            inset 0 0 0 3px #ff6b6b,
            0 0 20px #ff6b6b99;
          background: #ff6b6b22;
        }
      }
      .slots {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center; /* cards centered; sized to fit, never scroll */
        justify-content: flex-start;
        min-height: 0;
        padding: 3px 3px;
      }
      .slots.foe {
        justify-content: flex-end;
      }
      .banner {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 6px;
        border-top: 1px solid #23303f;
        border-bottom: 1px solid #23303f;
        background: #0d131b;
      }
      .pw {
        font-size: 19px;
        font-weight: 800;
        min-width: 24px;
        text-align: center;
        transition: color 0.2s;
      }
      .pw.foe {
        color: var(--bad);
      }
      .pw.you {
        color: var(--good);
      }
      .pw.dim {
        color: #3f4c5c;
      }
      .arrow {
        font-size: 10px;
        color: var(--dim);
      }

      /* CARDS — 2:3 art ratio, sized to fit lane width AND board height */
      .slot {
        width: var(--cw);
        aspect-ratio: 2/3;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .slot.empty {
        border: 1px dashed #2b3542;
        background: #121821;
      }
      .slot.empty.targetable {
        border: 1.5px dashed var(--amber);
        box-shadow: 0 0 10px #f4b74055;
        animation: pulse 1.1s infinite;
      }
      /* drag-and-drop targets */
      .slot.empty.dropok {
        border: 1.5px dashed var(--amber);
        box-shadow: 0 0 10px #f4b74055;
      }
      .slot.empty.drophover {
        border: 2px solid var(--amber);
        background: #f4b74022;
        box-shadow: 0 0 18px var(--amber);
        transform: scale(1.05);
      }
      .dragghost {
        position: fixed;
        width: 78px;
        aspect-ratio: 2/3;
        border-radius: 9px;
        transform: translate(-50%, -55%) rotate(-4deg);
        background-size: cover;
        background-position: center top;
        background-color: #222a35;
        border: 2px solid var(--amber);
        box-shadow: 0 10px 26px #000c;
        pointer-events: none;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        opacity: 0.95;
      }
      .slot.filled {
        border: 1px solid #3a4658;
        background: #222a35;
        box-shadow: 0 2px 6px #0007;
      }
      .slot.back {
        border: 1px solid #33465c;
        background: repeating-linear-gradient(
          45deg,
          #1a2735,
          #1a2735 5px,
          #16202b 5px,
          #16202b 10px
        );
      }
      .slot .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .slot .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 45%, #000c);
      }
      .slot .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        opacity: 0.16;
      }
      .slot .cost {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px #000a;
      }
      .slot .perk {
        position: absolute;
        top: 4px;
        right: 5px;
        font-size: 15px;
        text-shadow: 0 1px 2px #000;
      }
      .slot .atk {
        position: absolute;
        bottom: 1px;
        left: 5px;
        font-size: 22px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 4px #000;
      }
      .slot .pow {
        position: absolute;
        bottom: 1px;
        right: 5px;
        font-size: 24px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 4px #000;
        transition: color 0.15s;
      }
      .slot .pow.buffed {
        color: var(--good);
      }
      .slot .pow.debuffed {
        color: var(--bad);
      }
      .slot.staged {
        border: 1.5px solid var(--amber);
        box-shadow: 0 0 9px #f4b74066;
      }
      .rar-legendary.filled {
        border-color: #e0b04a;
      }
      .rar-epic.filled {
        border-color: #a259e0;
      }
      .rar-rare.filled {
        border-color: #4f9ad6;
      }

      .slot.flipin {
        animation: flipin 0.32s ease;
      }
      @keyframes flipin {
        from {
          transform: rotateY(85deg) scale(0.9);
          opacity: 0.1;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .slot.firing {
        animation: firing 0.42s;
      }
      @keyframes firing {
        50% {
          box-shadow:
            0 0 14px var(--amber),
            0 0 0 2px var(--amber);
        }
      }
      .slot.flash-buff {
        animation: fb 0.55s;
      }
      @keyframes fb {
        40% {
          box-shadow:
            0 0 16px #57d98a,
            inset 0 0 0 2px #57d98a;
        }
      }
      .slot.flash-debuff {
        animation: fd 0.55s;
      }
      @keyframes fd {
        40% {
          box-shadow:
            0 0 16px #ff6b6b,
            inset 0 0 0 2px #ff6b6b;
        }
      }
      .slot.clash {
        animation: clash 0.4s;
        z-index: 5;
      }
      @keyframes clash {
        30% {
          transform: translateY(5px) scale(0.94);
        }
        55% {
          box-shadow:
            0 0 14px #ff6b6b,
            inset 0 0 0 2px #ff6b6b;
        }
      }
      .slot.dying {
        animation: die 0.45s forwards;
        z-index: 6;
      }
      @keyframes die {
        30% {
          box-shadow: 0 0 20px #ff6b6b;
          filter: brightness(1.5);
        }
        100% {
          transform: scale(0.2) rotate(14deg);
          opacity: 0;
        }
      }
      .pow.ticking {
        animation: tick 0.32s;
      }
      @keyframes tick {
        40% {
          transform: scale(1.5);
        }
      }
      @keyframes pulse {
        50% {
          filter: brightness(1.3);
        }
      }
      .float {
        position: fixed;
        z-index: 90;
        font-weight: 800;
        font-size: 18px;
        pointer-events: none;
        text-shadow: 0 2px 5px #000;
        animation: floatup 0.9s ease forwards;
      }
      .float.pos {
        color: #7bf0a4;
      }
      .float.neg {
        color: #ff8a8a;
      }
      @keyframes floatup {
        0% {
          transform: translateY(4px);
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        100% {
          transform: translateY(-42px);
          opacity: 0;
        }
      }

      .msgbar {
        text-align: center;
        padding: 3px 8px;
        color: var(--dim);
        font-size: 11.5px;
        min-height: 18px;
        border-top: 1px solid var(--line);
      }
      .msgbar.err {
        color: var(--bad);
      }
      .youbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--dim);
      }
      .pips {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        max-width: 120px;
      }
      .pip {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2a3340;
        border: 1px solid #3a4658;
      }
      .pip.on {
        background: var(--amber);
        border-color: var(--amber);
        box-shadow: 0 0 5px #f4b74088;
      }
      .youbar .grow {
        margin-left: auto;
      }

      /* hand — horizontal scroll strip of 2:3 cards */
      /* hand = overlapping "held deck"; only the tops peek out. Tap -> modal. */
      .hand {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px 8px 4px;
        height: 92px; /* clips the cards so only their tops show */
        overflow: hidden;
        flex: 0 0 auto;
      }
      .hcard {
        width: var(--hw);
        aspect-ratio: 2/3;
        border-radius: 9px;
        position: relative;
        overflow: hidden;
        background: #222a35;
        border: 1px solid #3a4658;
        box-shadow: -3px 3px 8px #0008;
        flex: 0 0 auto;
        margin-left: calc(var(--hw) * -0.52); /* fan overlap */
        transition:
          transform 0.12s,
          margin 0.12s;
        cursor: grab;
        touch-action: none; /* let pointer-drag work on touch / pen without scrolling */
      }
      .hcard:first-child {
        margin-left: 0;
      }
      .hcard:active {
        transform: translateY(-10px);
        z-index: 20;
      }
      .hcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .hcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 30%, #000e);
      }
      .hcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        opacity: 0.15;
      }
      .hcard .cost {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hcard .perk {
        position: absolute;
        top: 4px;
        right: 5px;
        font-size: 12px;
      }
      .hcard .nm {
        position: absolute;
        top: 6px;
        left: 26px;
        right: 8px;
        font-size: 9px;
        text-align: center;
        text-shadow: 0 1px 2px #000;
      }
      .hcard .txt {
        position: absolute;
        left: 5px;
        right: 5px;
        bottom: 26px;
        font-size: 8px;
        line-height: 1.15;
        text-align: center;
        color: #e2eaf2;
        text-shadow: 0 1px 2px #000;
      }
      .hcard .atk {
        position: absolute;
        bottom: 2px;
        left: 6px;
        font-size: 18px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 3px #000;
      }
      .hcard .pow {
        position: absolute;
        bottom: 2px;
        right: 6px;
        font-size: 18px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 3px #000;
      }
      .hcard.playable:active {
        transform: translateY(-6px);
      }
      .hcard.unplayable {
        filter: grayscale(0.6) brightness(0.62);
      }
      .hcard.selected {
        box-shadow:
          0 0 0 3px var(--amber),
          0 0 14px #f4b740aa;
        transform: translateY(-12px);
        z-index: 15;
      }

      /* full-card modal */
      .cardmodal {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
      }
      .cardmodal.hidden {
        display: none;
      }
      .cmbg {
        position: absolute;
        inset: 0;
        background: #000d;
        backdrop-filter: blur(2px);
      }
      .cmwrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .bigcard {
        width: min(74vw, 52vh, 380px);
        aspect-ratio: 2/3;
        border-radius: 16px;
        position: relative;
        overflow: hidden;
        background: #222a35;
        border: 2px solid #3a4658;
        box-shadow: 0 12px 40px #000b;
      }
      .bigcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .bigcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 55%, #000d);
      }
      .bigcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 90px;
        opacity: 0.15;
      }
      .bigcard .cost {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 8px #000a;
      }
      .bigcard .perk {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 26px;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .nm {
        position: absolute;
        top: 12px;
        left: 60px;
        right: 44px;
        font-size: 17px;
        font-weight: 700;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .txt {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 44px;
        font-size: 13px;
        line-height: 1.3;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .atk {
        position: absolute;
        bottom: 6px;
        left: 12px;
        font-size: 38px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 4px #000;
      }
      .bigcard .pow {
        position: absolute;
        bottom: 6px;
        right: 12px;
        font-size: 40px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 4px #000;
      }
      .cmbtns {
        display: flex;
        gap: 12px;
      }
      .rar-legendary {
        border-color: #e0b04a;
      }
      .rar-epic {
        border-color: #a259e0;
      }
      .rar-rare {
        border-color: #4f9ad6;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: #000c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        z-index: 50;
        padding: 18px;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay h1 {
        font-size: 40px;
        margin: 0;
      }
      .win {
        color: var(--good);
      }
      .lose {
        color: var(--bad);
      }
      .setup {
        background: #141a22;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }
      .laneres {
        display: flex;
        gap: 8px;
      }
      .laneres div {
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-weight: 700;
        font-size: 13px;
      }
      .reward {
        font-size: 13px;
        font-weight: 700;
        color: var(--amber);
      }
      .reward.win {
        color: var(--good);
      }

      /* campaign + library panels */
      .menu {
        position: absolute;
        inset: 0;
        background: #0e1116;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 8px;
      }
      .menuhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 17px;
        padding: 2px 4px;
      }
      .lvlist {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .lvl {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #171e28;
        cursor: pointer;
      }
      .lvl:active {
        transform: scale(0.99);
      }
      .lvl.locked {
        opacity: 0.5;
        cursor: default;
        background: #10141b;
      }
      .lvl.beaten {
        border-color: #2e5a3f;
      }
      .lvnum {
        font-weight: 800;
        min-width: 42px;
      }
      .lvname {
        flex: 1;
        display: flex;
        flex-direction: column;
        font-weight: 700;
      }
      .lvname small {
        font-weight: 400;
        color: var(--dim);
        font-size: 11px;
      }
      .lvdiff {
        font-size: 11px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 20px;
        border: 1px solid var(--line);
      }
      .d-Easy {
        color: var(--good);
      }
      .d-Normal {
        color: #cfe08a;
      }
      .d-Hard {
        color: var(--amber);
      }
      .d-VeryHard {
        color: #ff9d6b;
      }
      .d-Boss {
        color: var(--bad);
        border-color: var(--bad);
      }
      .libgrid {
        flex: 1;
        min-height: 0; /* allow flex child to shrink so overflow-y scrolling engages */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 per row */
        grid-auto-rows: max-content; /* rows hug card height (don't divide the viewport) */
        gap: 14px;
        align-content: start;
        align-items: start; /* don't stretch cards to row height — preserves their 2:3 aspect-ratio */
        padding: 6px 4px 18px;
        perspective: 1000px;
      }
      .libcard {
        aspect-ratio: 2/3;
        border-radius: 14px;
        position: relative;
        overflow: hidden;
        border: 2px solid #3a4658;
        background: #222a35;
        cursor: pointer;
        box-shadow: 0 4px 12px #0008;
        transition:
          transform 0.3s cubic-bezier(0.2, 0.7, 0.3, 1.3),
          box-shadow 0.3s ease,
          border-color 0.3s ease;
        animation: libpop 0.45s both;
        animation-delay: calc(var(--i, 0) * 26ms);
        will-change: transform;
      }
      @keyframes libpop {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.93);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .libcard.rar-legendary {
        --rarcol: #e6b84e;
      }
      .libcard.rar-epic {
        --rarcol: #b06bf0;
      }
      .libcard.rar-rare {
        --rarcol: #4f9ad6;
      }
      .libcard.rar-common {
        --rarcol: #8090a0;
      }
      .rar-common.filled {
        border-color: #6b7a8c;
      }
      .libcard:active {
        transform: scale(0.97);
      }
      .libcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      .libcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 55%, #000d);
      }
      .libcard .shine {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;

          #ffffff55 48%,
          #fff0 64%
        );

      }
      @keyframes shine {
        0% {
          transform: translateX(-130%);

      /* resting state: slim name bar keeps ~75% of the art visible */
      .libcard .namebar {

        padding: 22px 8px 11px;

      /* hover: rich detail panel slides up over the lower art */
      .libcard .reveal {

      /* FULL view: the entire collection as an art wall — every card fits in ONE screen,

      .libgrid.full {

      .libgrid.full .libcard .namebar,

      /* GRID view: clean full-art thumbnail + caption BELOW — nothing overlaps the art */
      .gcard {
        border-radius: 12px;
        overflow: hidden;
        background: #151b24;
        border: 2px solid #3a4658;
        cursor: pointer;
        box-shadow: 0 4px 12px #0008;
        display: flex;
        flex-direction: column;
        animation: libpop 0.45s both;
        animation-delay: calc(var(--i, 0) * 26ms);
        transition:
          transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1.3),
          box-shadow 0.28s ease,
          border-color 0.28s ease;
        will-change: transform;
      }
      .gcard.rar-legendary {
        --rarcol: #e6b84e;
      }
      .gcard.rar-epic {
        --rarcol: #b06bf0;
      }
      .gcard.rar-rare {
        --rarcol: #4f9ad6;
      }

        --rarcol: #8090a0;
      }
      .gcard:active {
        transform: scale(0.98);
      }
      .gcard .thumb {
        position: relative;
        aspect-ratio: 2/3;
        overflow: hidden;
      }
      .gcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);

      .gcard .clv {

      @media (hover: hover) {

      @media (hover: hover) {
        .libcard:hover {

      .libcard .xpbar {

  <body>
    <div id="app">
      <div class="topbar">
        <span class="brand">◆ LANES</span>
        <span class="turn" id="turn"></span>
        <span class="timer" id="timer"></span>
        <span class="record" id="record"></span>
        <button
          class="btn newbtn"
          onclick="showOptions()"
          title="Sound options"
        >
          ⚙
        </button>
        <button class="btn newbtn" onclick="openHome()">Menu</button>
      </div>

      <div class="lanes" id="lanes"></div>

      <div class="msgbar" id="msg"></div>
      <div class="youbar">
        <span class="pips" id="energyPips"></span>
        <span id="energyNum"></span>
        <span class="grow"></span>
        <button class="btn" id="resetBtn" onclick="resetTurn()">↺</button>
        <button class="btn primary" id="endBtn" onclick="endTurn()">
          Reveal ▶
        </button>
      </div>
      <div class="hand" id="hand"></div>
    </div>

    <div class="overlay" id="overlay"><div id="over"></div></div>
    <div class="cardmodal hidden" id="cardModal">
      <div class="cmbg" onclick="closeCard()"></div>
      <div class="cmwrap" id="cmwrap"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let STATE = null,
        SEL = null,
        ANIMATING = false;
      const SP = () => (STATE && STATE.slotsPerLane) || 3;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      /* ============ SOUND FX ============ */
      const SFX = (() => {
        // name -> [file, per-sound base volume]
        const SPEC = {
          // UI & navigation
          click: ["/sfx/Button_click.mp3", 0.5],
          hover: ["/sfx/Button_hover.mp3", 0.22],
          menuOpen: ["/sfx/menu_open.mp3", 0.6],
          menuClose: ["/sfx/Menu_close.mp3", 0.6],
          levelSelect: ["/sfx/Level_select.mp3", 0.7],
          levelLocked: ["/sfx/Level_locked.mp3", 0.6],
          libraryOpen: ["/sfx/Library_open.mp3", 0.6],
          viewToggle: ["/sfx/view_toggle.mp3", 0.5],
          // card & hand
          cardDraw: ["/sfx/card_draw.mp3", 0.55],
          cardHover: ["/sfx/card_hover.mp3", 0.25],
          cardModalOpen: ["/sfx/cord_modal_open.mp3", 0.55], // NOTE: file is misspelled "cord"
          cardModalClose: ["/sfx/card_modal_close.mp3", 0.5],
          cardPickUp: ["/sfx/card_pick_up.mp3", 0.5],
          dropHighlight: ["/sfx/drop-target_highlight.mp3", 0.3],
          cardStage: ["/sfx/card_stage_place.mp3", 0.6],
          stageDeniedEnergy: ["/sfx/stage_denied_energy.mp3", 0.5],
          stageDeniedLaneFull: ["/sfx/stage_denied_lane-full.mp3", 0.5],
          resetTurn: ["/sfx/reset_turn.mp3", 0.55],
          // turn & phase
          turnStart: ["/sfx/turn_start.mp3", 0.6],
          energyGain: ["/sfx/energy_gain.mp3", 0.45],
          endTurn: ["/sfx/end_turn.mp3", 0.6],
          revealFlip: ["/sfx/reveal_flip.mp3", 0.5],
          opponentReveal: ["/sfx/opponent_reveal.mp3", 0.5],
          // progression
          xpGain: ["/sfx/xp_gain.mp3", 0.55],
          cardLevelUp: ["/sfx/card_level_up.mp3", 0.6],
          cardUnlock: ["/sfx/card_unlock.mp3", 0.7],
          progressSaved: ["/sfx/progress_saved.mp3", 0.4],
        };
        let muted = false,
          vol = 0.8; // master volume 0..1
        try {
          muted = localStorage.getItem("sparkMute") === "1";
          const v = parseFloat(localStorage.getItem("sparkVol"));
          if (!isNaN(v)) vol = Math.min(1, Math.max(0, v));
        } catch (e) {}
        const base = {};
        for (const k in SPEC) {
          const a = new Audio(SPEC[k][0]);
          a.preload = "auto";
          base[k] = a;
        }
        function play(name) {
          if (muted || vol <= 0) return;
          const src = base[name];
          if (!src) return;
          try {
            // clone so overlapping/rapid triggers each get their own playback
            const a = src.cloneNode();
            a.volume = Math.min(1, SPEC[name][1] * vol);
            const p = a.play();
            if (p && p.catch) p.catch(() => {}); // ignore autoplay-policy rejects
          } catch (e) {}
        }
        function setMuted(v) {
          muted = !!v;
          try {
            localStorage.setItem("sparkMute", muted ? "1" : "0");
          } catch (e) {}
        }
        function setVolume(v) {
          vol = Math.min(1, Math.max(0, v));
          try {
            localStorage.setItem("sparkVol", String(vol));
          } catch (e) {}
        }
        return {
          play,
          setMuted,
          isMuted: () => muted,
          toggleMute: () => {
            setMuted(!muted);
            return muted;
          },
          setVolume,
          getVolume: () => vol,
        };
      })();

      /* ============ ARENA MUSIC (looping background per level) ============ */
      // Filename-driven: tries /music/<Level Name>.mp3. Drop a new mp3 named
      // exactly after a level and it plays automatically — no code change.
      // Shares SFX's mute state; has its own volume so it sits under the SFX.
      const MUSIC = (() => {
        const DIR = "/music/";
        // Level names may contain apostrophes (Kraken's Abyss) but the track
        // files don't — strip them so "Kraken's Abyss" -> Krakens Abyss.mp3.
        const fileFor = (n) =>
          DIR + encodeURIComponent(n.replace(/['’]/g, "")) + ".mp3";
        let vol = 0.15; // music volume 0..1 (sits well under the SFX by default)
        try {
          const v = parseFloat(localStorage.getItem("sparkMusicVol"));
          if (!isNaN(v)) vol = Math.min(1, Math.max(0, v));
        } catch (e) {}
        const el = new Audio();
        el.loop = true;
        el.preload = "auto";
        let current = null; // arena name currently loaded
        let fadeTimer = null;
        const muted = () => SFX.isMuted();
        const target = () => (muted() ? 0 : vol);
        function fadeTo(to, done) {
          clearInterval(fadeTimer);
          const step = (to - el.volume) / 12 || to - el.volume; // ~0.4s
          fadeTimer = setInterval(() => {
            const nv = el.volume + step;
            if ((step >= 0 && nv >= to) || (step < 0 && nv <= to)) {
              el.volume = Math.max(0, Math.min(1, to));
              clearInterval(fadeTimer);
              if (done) done();
            } else {
              el.volume = Math.max(0, Math.min(1, nv));
            }
          }, 30);
        }
        function start() {
          const p = el.play();
          if (p && p.catch) p.catch(() => {}); // autoplay policy / missing file
        }
        function playArena(name) {
          const same = current === name;
          current = name;
          if (muted()) {
            try {
              el.pause();
            } catch (e) {}
            return;
          }
          if (same && !el.paused && el.src) {
            fadeTo(target());
            return;
          }
          el.src = fileFor(name);
          el.volume = 0;
          start();
          fadeTo(target());
        }
        function stop() {
          if (el.paused && current == null) return;
          current = null;
          fadeTo(0, () => {
            try {
              el.pause();
              el.currentTime = 0;
            } catch (e) {}
          });
        }
        function applyMute() {
          if (muted()) {
            fadeTo(0, () => {
              try {
                el.pause();
              } catch (e) {}
            });
          } else if (current) {
            if (!el.src) el.src = fileFor(current);
            el.volume = 0;
            start();
            fadeTo(target());
          }
        }
        function setVolume(v) {
          vol = Math.min(1, Math.max(0, v));
          try {
            localStorage.setItem("sparkMusicVol", String(vol));
          } catch (e) {}
          if (!muted() && current) fadeTo(target());
        }
        return {
          playArena,
          stop,
          applyMute,
          setVolume,
          getVolume: () => vol,
        };
      })();

      // Generic UI feedback: any button click, and hover on interactive elements.
      document.addEventListener("click", (e) => {
        if (e.target.closest(".btn, .segbtn")) SFX.play("click");
      });
      let _hoverEl = null;
      document.addEventListener("pointerover", (e) => {
        const el = e.target.closest(
          ".btn, .segbtn, .lvl:not(.locked), .libcard, .gcard, .hcard",
        );
        if (el === _hoverEl) return; // one blip per element entry, not per pixel
        _hoverEl = el;
        if (!el) return;

      /* ---- per-round countdown: auto-reveal so a player can't stall forever ---- */
      const TURN_SECONDS = 30;

      }
      function laneHTML(L) {
        const s = STATE;

          SEL != null &&

        L.foe.forEach((c) => (foe += slotHTML(c)));

      let _modalCloseSnd = "cardModalClose"; // which close cue closeCard() should use
      function openCard(i) {

      // Sound for a stage attempt: placed OK, or denied (no energy / lane full).

      /* ---- drag & drop (mouse / touch / pen via Pointer Events) ---- */
      let DRAG = null;
      function startHandDrag(e, i) {
        if (ANIMATING) return;
        const c = STATE.you.hand.find((x) => x.index === i);
        if (!c) return;
        DRAG = {
          i,
          c,
          x: e.clientX,
          y: e.clientY,
          moved: false,
          ghost: null,

              .forEach((s) => {

      function elFromHTML(html) {

      /* ============ CAMPAIGN / COLLECTION / XP (client-side progress) ============ */
      let LEVELS = [],
        POOL = [],
        PROG = null,
        LAST = { level: 0, deck: [] },
        MATCH_RESOLVED = false;
      const RARW = { common: 0, rare: 1, epic: 2, legendary: 3 };
      let LIB_VIEW = "compact"; // "compact" (art-focused, hover-reveal) | "full" (all details shown)
      const CURVE = { 1: 1, 2: 4, 3: 4, 4: 3, 5: 2, 6: 2 };
      const LVL_CAP = 5;
      const PROG_VER = 2; // bump to reset saves when the pool/ids change
      const byId = (id) => POOL.find((c) => c.id === id);
      const strength = (c) =>
        c.attack + c.power + 2 * RARW[c.rarity] + (c.text ? 2 : 0);
      const atkAt = (c, l) => c.attack + Math.floor((l - 1) / 2);
      const powAt = (c, l) => c.power + (l - 1);
      const xpToNext = (l) => l * 3; // L1->2:3, 2->3:6 ...

      function starterSet() {
        // the weakest cards in each cost bucket -> a full-curve, all-art starter deck
        const ids = new Set();
        for (const cost in CURVE) {
          POOL.filter((c) => c.cost == cost)
            .sort((a, b) => strength(a) - strength(b))
            .slice(0, CURVE[cost] + 1)
            .forEach((c) => ids.add(c.id));
        }
        return ids;
      }
      function lockedCards() {
        const st = starterSet();
        return POOL.filter((c) => !st.has(c.id)).sort(
          (a, b) => strength(a) - strength(b),
        );
      }
      function unlocksForLevel(i) {
        const lk = lockedCards();
        const per = Math.ceil(lk.length / Math.max(1, LEVELS.length));
        return lk.slice(i * per, (i + 1) * per);
      }
      function loadProg() {
        try {
          PROG = JSON.parse(localStorage.getItem("sparkLanes"));
        } catch (e) {
          PROG = null;
        }
        if (!PROG || PROG.ver !== PROG_VER || !PROG.cards) {
          PROG = { ver: PROG_VER, unlocked: 0, beaten: {}, cards: {} };
          starterSet().forEach((id) => (PROG.cards[id] = { xp: 0, lvl: 1 }));
          saveProg();
        }
      }
      function saveProg() {
        localStorage.setItem("sparkLanes", JSON.stringify(PROG));
      }
      function owned() {
        return Object.keys(PROG.cards).map((id) => parseInt(id));
      }

      function buildDeck() {
        // best 16 owned cards by leveled strength, following the curve
        const own = owned()
          .map((id) => ({ c: byId(id), p: PROG.cards[id] }))
          .filter((x) => x.c);
        const lstr = (x) =>
          atkAt(x.c, x.p.lvl) + powAt(x.c, x.p.lvl) + (x.c.text ? 2 : 0);
        const pick = [];
        const used = new Set();
        for (const cost in CURVE) {
          const bucket = own
            .filter((x) => x.c.cost == cost)
            .sort((a, b) => lstr(b) - lstr(a));
          for (let k = 0; k < CURVE[cost] && k < bucket.length; k++) {
            pick.push(bucket[k]);
            used.add(bucket[k].c.id);
          }
        }
        if (pick.length < 16) {
          own
            .filter((x) => !used.has(x.c.id))
            .sort((a, b) => lstr(b) - lstr(a))
            .forEach((x) => {
              if (pick.length < 16) pick.push(x);
            });
        }
        return pick.slice(0, 16).map((x) => ({ id: x.c.id, level: x.p.lvl }));
      }

      /* ---- screens ---- */
      function openHome() {
        SFX.play("menuOpen");

        const done = Object.keys(PROG.beaten).length;
        $("over").innerHTML = `<div class="setup">
          <h1 style="font-size:30px" class="win">◆ SPARK: LANES</h1>
          <div class="hint">Beat levels to unlock cards, grind XP to level them up,
            and climb toward the Kraken. Progress ${done}/${LEVELS.length} levels.</div>
          <button class="btn primary" style="font-size:16px;padding:12px 22px" onclick="showCampaign()">▶ Campaign</button>
          <button class="btn" style="font-size:15px;padding:10px 20px" onclick="SFX.play('libraryOpen');showLibrary()">▤ Card Library</button>
          <button class="btn" style="font-size:15px;padding:10px 20px" onclick="showOptions()">⚙ Options</button>
        </div>`;
        $("overlay").classList.remove("hidden");
      }
      /* ---- options (sound: volume + mute) ---- */
      function showOptions() {
        const vol = Math.round(SFX.getVolume() * 100);
        const mvol = Math.round(MUSIC.getVolume() * 100);
        const muted = SFX.isMuted();
        $("over").innerHTML = `<div class="menu">
          <div class="menuhead"><b>⚙ Options</b><button class="btn newbtn" onclick="closeOptions()">✕ Close</button></div>
          <div style="display:flex;flex-direction:column;gap:20px;padding:20px 8px;max-width:440px">
            <div style="display:flex;align-items:center;gap:14px">
              <span style="width:96px">🔊 Effects</span>
              <input id="volSlider" type="range" min="0" max="100" value="${vol}" ${muted ? "disabled" : ""}
                style="flex:1" oninput="onVolInput(this.value)" onchange="SFX.play('hover')">
              <span id="volVal" style="width:46px;text-align:right">${vol}%</span>
            </div>
            <div style="display:flex;align-items:center;gap:14px">
              <span style="width:96px">🎵 Music</span>
              <input id="musicSlider" type="range" min="0" max="100" value="${mvol}" ${muted ? "disabled" : ""}
                style="flex:1" oninput="onMusicVolInput(this.value)">
              <span id="musicVal" style="width:46px;text-align:right">${mvol}%</span>
            </div>
            <label style="display:flex;align-items:center;gap:14px;cursor:pointer">
              <span style="width:96px">🔇 Mute</span>
              <input type="checkbox" ${muted ? "checked" : ""} onchange="onMuteToggle(this.checked)">
              <span style="color:var(--dim)">Silence all sound &amp; music</span>
            </label>
            <div class="hint">Sound settings are saved on this device.</div>
          </div></div>`;
        $("overlay").classList.remove("hidden");
      }
      function onVolInput(v) {
        SFX.setVolume(v / 100);
        const el = $("volVal");
        if (el) el.textContent = Math.round(v) + "%";
      }
      function onMusicVolInput(v) {
        MUSIC.setVolume(v / 100);
        const el = $("musicVal");
        if (el) el.textContent = Math.round(v) + "%";
      }
      function onMuteToggle(m) {
        SFX.setMuted(m);
        MUSIC.applyMute(); // mute/unmute the arena theme too
        const s = $("volSlider"),
          ms = $("musicSlider");
        if (s) s.disabled = m;
        if (ms) ms.disabled = m;
        if (!m) SFX.play("click"); // confirm audibly when turning sound back on
      }
      function closeOptions() {
        $("overlay").classList.add("hidden");
        if (STATE && STATE.started && !STATE.over) render();
        else openHome();
      }
      function showCampaign() {
        const rows = LEVELS.map((L) => {
          const locked = L.id > PROG.unlocked;
          const beaten = PROG.beaten[L.id];
          const tag = locked ? "🔒" : beaten ? "✓" : "▶";
          const cls = locked ? "lvl locked" : "lvl" + (beaten ? " beaten" : "");
          const click = locked
            ? `onclick="SFX.play('levelLocked')"`
            : `onclick="startLevel(${L.id})"`;
          return `<div class="${cls}" ${click}>
            <span class="lvnum">${tag} ${L.id + 1}</span>
            <span class="lvname">${L.name}<small>${locked ? "Locked — beat level " + L.id : L.sub}</small></span>
            <span class="lvdiff d-${L.difficulty.replace(" ", "")}">${L.difficulty}</span></div>`;
        }).join("");
        $("over").innerHTML = `<div class="menu">
          <div class="menuhead"><b>Campaign</b><button class="btn newbtn" onclick="openHome()">◀ Back</button></div>
          <div class="lvlist">${rows}</div></div>`;
        $("overlay").classList.remove("hidden");
      }
      function unlockLevelOf(id) {
        for (let i = 0; i < LEVELS.length; i++)
          if (unlocksForLevel(i).some((x) => x.id === id)) return i + 1;
        return "?";
      }
      // FULL view — card-face with overlays (art + name + stats + perk shown over the art)
      function libCardFull(c, p, idx) {
        const bg = c.art
          ? `<div class="art" style="background-image:url('${c.art}')"></div>`
          : `<div class="glyph">${glyph(c)}</div>`;
        if (!p)
          return `<div class="libcard rar-${c.rarity} lockedcard" data-lib="${c.id}" style="--i:${idx}">${bg}
            <div class="lockveil"><div class="lk">🔒</div><div class="unlocklbl">Unlocks Lv ${unlockLevelOf(c.id)}</div></div></div>`;
        const a = atkAt(c, p.lvl),
          pw = powAt(c, p.lvl);
        const need = p.lvl >= LVL_CAP ? 0 : xpToNext(p.lvl);
        const bar = need
          ? `<div class="xpbar"><i style="width:${Math.min(100, (100 * p.xp) / need)}%"></i></div>`
          : `<div class="xpmax">MAX</div>`;
        const perk = c.text ? c.text : "No ability";
        return `<div class="libcard rar-${c.rarity} filled" data-lib="${c.id}" style="--i:${idx}">${bg}
          <div class="shine"></div>
          <div class="cost">${c.cost}</div><div class="lvbadge">L${p.lvl}</div>
          <div class="namebar">${c.name}</div>
          <div class="reveal">
            <div class="rname">${c.name}</div>
            <div class="rstats"><span class="atk">⚔${a}</span><span class="pow">◆${pw}</span></div>
            <div class="rperk">${perk}</div>
            <div class="rhint">tap to view</div>
          </div>${bar}</div>`;
      }
      // GRID view — clean full-art thumbnail with a caption BELOW; nothing overlaps the art
      function libCardGrid(c, p, idx) {
        const bg = c.art
          ? `<div class="art" style="background-image:url('${c.art}')"></div>`
          : `<div class="glyph">${glyph(c)}</div>`;
        if (!p)
          return `<div class="gcard rar-${c.rarity} lockedcard" data-lib="${c.id}" style="--i:${idx}">
            <div class="thumb">${bg}<div class="lockveil"><div class="lk">🔒</div></div></div>
            <div class="cap"><div class="caprow"><span class="cnm dim">${c.name}</span></div>
              <div class="caprow"><span class="clk">🔒 Unlocks Lv ${unlockLevelOf(c.id)}</span></div></div></div>`;
        const a = atkAt(c, p.lvl),
          pw = powAt(c, p.lvl);
        const need = p.lvl >= LVL_CAP ? 0 : xpToNext(p.lvl);
        const bar = need
          ? `<div class="capxp"><i style="width:${Math.min(100, (100 * p.xp) / need)}%"></i></div>`
          : `<div class="capxp max"><i style="width:100%"></i></div>`;
        return `<div class="gcard rar-${c.rarity} filled" data-lib="${c.id}" style="--i:${idx}">
          <div class="thumb">${bg}<div class="shine"></div></div>
          <div class="cap">
            <div class="caprow"><span class="ccost">${c.cost}</span><span class="cnm">${c.name}</span><span class="clv">L${p.lvl}</span></div>
            <div class="caprow"><span class="cstat atk">⚔ ${a}</span><span class="cstat pow">◆ ${pw}</span></div>
            ${bar}
          </div></div>`;
      }
      function showLibrary() {
        const tpl = LIB_VIEW === "full" ? libCardFull : libCardGrid;
        const cards = [...POOL]
          .sort((a, b) => a.cost - b.cost || strength(a) - strength(b))
          .map((c, idx) => tpl(c, PROG.cards[c.id], idx))
          .join("");
        const own = owned().length;
        const on = (v) => (LIB_VIEW === v ? " on" : "");
        $("over").innerHTML = `<div class="menu">
          <div class="menuhead"><b>Card Library — ${own}/${POOL.length}</b><button class="btn newbtn" onclick="openHome()">◀ Back</button></div>
          <div class="libtoggle">
            <button class="segbtn${on("compact")}" onclick="setLibView('compact')">▦ Grid</button>
            <button class="segbtn${on("full")}" onclick="setLibView('full')">🃏 Full view</button>
          </div>
          <div class="libgrid${LIB_VIEW === "full" ? " full" : ""}">${cards}</div></div>`;
        $("overlay").classList.remove("hidden");
        document
          .querySelectorAll("[data-lib]")
          .forEach(
            (el) => (el.onclick = () => openLibCard(parseInt(el.dataset.lib))),
          );
        if (LIB_VIEW === "full") fitFullView();
      }
      // Full view = the whole collection in ONE screen. Pick the fewest columns
      // (=> biggest cards) whose resulting rows still fit the grid's height, no scroll.
      function fitFullView() {
        const grid = document.querySelector(".libgrid.full");
        if (!grid) return;
        const n = POOL.length;
        const cs = getComputedStyle(grid);
        const gap = parseFloat(cs.rowGap) || 6;
        const W =
          grid.clientWidth -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight);
        const H =
          grid.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom);
        if (W <= 0 || H <= 0) return;
        const ASPECT = 1.5; // card height / width (2:3)
        let cols = n;
        for (let c = 1; c <= n; c++) {
          const w = (W - (c - 1) * gap) / c;
          const rows = Math.ceil(n / c);
          const need = rows * (w * ASPECT) + (rows - 1) * gap;
          if (need <= H) {
            cols = c;
            break;
          }
        }
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      }
      window.addEventListener("resize", () => {
        if (document.querySelector(".libgrid.full")) fitFullView();
      });
      function setLibView(v) {
        if (LIB_VIEW === v) return;
        SFX.play("viewToggle");
        LIB_VIEW = v;
        showLibrary();
      }
      function openLibCard(id) {
        const c = byId(id);
        if (!c) return;
        _modalCloseSnd = "menuClose"; // library popup is part of the menu flow
        SFX.play("cardModalOpen");
        const p = PROG.cards[id];
        const owned = !!p;
        const lvl = owned ? p.lvl : 1;
        const a = atkAt(c, lvl),
          pw = powAt(c, lvl);
        const art = c.art
          ? `<div class="art" style="background-image:url('${c.art}')"></div><div class="veil"></div>`
          : `<div class="glyph">${glyph(c)}</div>`;
        const perk = c.text ? `<div class="perk">${glyph(c)}</div>` : "";
        const lvbadge = owned
          ? `<div class="lvbadge" style="font-size:14px">L${lvl}</div>`
          : "";
        let info;
        if (owned) {
          const need = lvl >= LVL_CAP ? 0 : xpToNext(lvl);
          info = need
            ? `<div class="dtag">Level ${lvl} · XP ${p.xp}/${need}</div>
               <div class="xpbar big"><i style="width:${Math.min(100, (100 * p.xp) / need)}%"></i></div>`
            : `<div class="dtag" style="color:var(--amber)">MAX LEVEL</div>`;
        } else {
          info = `<div class="dtag" style="color:var(--dim)">🔒 Locked — beat Level ${unlockLevelOf(id)} to unlock</div>`;
        }
        $("cmwrap").innerHTML = `<div class="bigcard rar-${c.rarity}">${art}
            <div class="cost">${c.cost}</div>${perk}${lvbadge}
            <div class="nm">${c.name}</div>${c.text ? `<div class="txt">${c.text}</div>` : ""}
            <div class="atk">⚔ ${a}</div><div class="pow">${pw}</div></div>
          <div class="dcap">${c.rarity.toUpperCase()} · Cost ${c.cost}</div>
          ${info}
          <div class="cmbtns"><button class="btn" onclick="closeCard()">Close</button></div>`;
        $("cardModal").classList.remove("hidden");
      }

      async function startLevel(i) {
        SFX.play("levelSelect");
        // Start the arena theme synchronously inside the click gesture (before
        // the await) so the browser's autoplay policy doesn't block it.
        if (LEVELS[i]) MUSIC.playArena(LEVELS[i].name);
        const deck = buildDeck();
        LAST = { level: i, deck };
        MATCH_RESOLVED = false;
        resetTimer(); // fresh match — clear any stale countdown state
        STATE = await api("/api/new", { level: i, deck });
        SEL = null;
        ANIMATING = false;
        $("overlay").classList.add("hidden");
        render();
        playTurnStartCues(); // opening hand + first round begins
      }

      function finishMatch() {
        if (MATCH_RESOLVED) return;
        MATCH_RESOLVED = true;
        const won = STATE.winner === "human";
        // award XP to every card that was in your deck
        const gain = won ? 3 : 1;
        const levelUps = [];
        LAST.deck.forEach((d) => {
          const p = PROG.cards[d.id];
          if (!p) return;
          p.xp += gain;
          while (p.lvl < LVL_CAP && p.xp >= xpToNext(p.lvl)) {
            p.xp -= xpToNext(p.lvl);
            p.lvl++;
            levelUps.push({ id: d.id, lvl: p.lvl });
          }
        });
        // unlock next level + its cards on a win
        const unlocked = [];
        if (won) {
          PROG.beaten[LAST.level] = true;
          if (LAST.level + 1 < LEVELS.length)
            PROG.unlocked = Math.max(PROG.unlocked, LAST.level + 1);
          unlocksForLevel(LAST.level).forEach((c) => {
            if (!PROG.cards[c.id]) {
              PROG.cards[c.id] = { xp: 0, lvl: 1 };
              unlocked.push(c);
            }
          });
        }
        saveProg();
        showResult(won, levelUps, unlocked);
      }

      function showResult(won, levelUps, unlocked) {
        const s = STATE;
        const t = won
          ? ["VICTORY", "win"]
          : s.winner === "bot"
            ? ["DEFEAT", "lose"]
            : ["DRAW", "win"];
        const ups = levelUps.length
          ? `<div class="reward">⬆ ${levelUps.map((u) => byId(u.id).name + " → L" + u.lvl).join(", ")}</div>`
          : "";
        const unl = unlocked.length
          ? `<div class="reward win">★ Unlocked: ${unlocked.map((c) => c.name).join(", ")}</div>`
          : "";
        const nextLv = LAST.level + 1;
        const canNext = won && nextLv < LEVELS.length;
        const btns =
          (canNext
            ? `<button class="btn primary" onclick="startLevel(${nextLv})">Next ▶</button>`
            : `<button class="btn primary" onclick="startLevel(${LAST.level})">${won ? "Play Again" : "Retry"}</button>`) +
          `<button class="btn" onclick="showCampaign()">Levels</button>`;
        $("over").innerHTML = `<h1 class="${t[1]}">${t[0]}</h1>
          <div style="font-size:26px;font-weight:800">${s.score.you} – ${s.score.foe}</div>
          <div class="hint">+${won ? 3 : 1} XP to each card you played.</div>
          ${ups}${unl}
          <div class="cmbtns">${btns}</div>`;
        $("overlay").classList.remove("hidden");
        // reward jingle: XP tally → level-ups → unlocks → saved confirmation
        SFX.play("xpGain");
        let dly = 550;
        if (levelUps.length) {
          setTimeout(() => SFX.play("cardLevelUp"), dly);
          dly += 600;
        }
        if (unlocked.length) {
          setTimeout(() => SFX.play("cardUnlock"), dly);
          dly += 750;
        }
        setTimeout(() => SFX.play("progressSaved"), dly);
      }

      (async () => {
        try {
          [LEVELS, POOL] = await Promise.all([
            api("/api/levels"),
            api("/api/pool"),
          ]);
          if (!Array.isArray(LEVELS) || !Array.isArray(POOL)) {
            throw new Error(
              "API returned unexpected data (levels/pool not arrays).",
            );
          }
          loadProg();
          STATE = await api("/api/state");
          if (STATE.started && !STATE.over) render();
          else openHome();
        } catch (e) {
          // Don't leave a black screen — surface the failure so it's debuggable.
          $("over").innerHTML = `<div class="setup">
            <h1 style="font-size:22px" class="bad">⚠ Failed to start</h1>
            <div class="hint">The game server API didn't respond correctly.<br>
              <code style="color:#ff9">${String(e && e.message ? e.message : e)}</code><br>
              Check the browser console (F12) and the /api/ endpoints.</div>
            <button class="btn primary" onclick="location.reload()">Retry</button>
          </div>`;
          $("overlay").classList.remove("hidden");
        }
      })();
    </script>
  </body>
</html>
