<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>SMUDGE: PANEL BRAWL</title>
    <style>
      :root {
        --bg: #0e1116;
        --line: #2a3340;
        --ink: #e8edf2;
        --dim: #93a1b0;
        --amber: #f4b740;
        --blue: #4f9ad6;
        --good: #57d98a;
        --bad: #ff6b6b;
        /* board card sized to fit BOTH lane width and board height -> never scrolls.
           px cap keeps cards inside the lane on wide (desktop) viewports. */
        --cw: min(33vw, 11.5vh, 150px);
        --hw: 82px; /* hand card width (overlapping fan) */
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(
          120% 80% at 50% 0%,
          #16202b 0%,
          var(--bg) 70%
        );
        color: var(--ink);
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        position: relative;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      .btn {
        background: #1c2530;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 700;
        font-size: 13px;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .btn.primary {
        background: linear-gradient(180deg, #f4b740, #c98f1c);
        color: #241a05;
        border: none;
      }

      /* top bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: #0c0f14;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 1px;
        font-size: 15px;
        background: linear-gradient(90deg, var(--amber), #ffe29a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        white-space: nowrap;
      }
      .turn {
        color: var(--dim);
        font-size: 12px;
      }
      .timer {
        font-weight: 800;
        font-size: 13px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        min-width: 40px;
        letter-spacing: 0.3px;
      }
      .timer.low {
        color: var(--bad);
        animation: pulse 1s infinite;
      }
      .record {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 800;
        font-size: 13px;
        margin-left: auto;
      }
      .flag {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        background: #1c2530;
        border: 1px solid var(--line);
      }
      .flag.you {
        background: #183a26;
        border-color: var(--good);
        color: var(--good);
      }
      .flag.foe {
        background: #3a1a1a;
        border-color: var(--bad);
        color: var(--bad);
      }
      .newbtn {
        font-size: 11px;
        padding: 5px 9px;
      }

      /* lanes fill all remaining space */
      .lanes {
        flex: 1;
        display: flex;
        gap: 5px;
        padding: 5px;
        min-height: 0;
        align-items: stretch;
        overflow: hidden;
      }
      .lane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          #ff6b6b10,
          transparent 34%,
          transparent 66%,
          #57d98a12
        );
        border: 1px solid #1f2733;
        transition: box-shadow 0.25s;
      }
      .lane.win-you {
        box-shadow: inset 0 0 0 1.5px #57d98a66;
      }
      .lane.win-foe {
        box-shadow: inset 0 0 0 1.5px #ff6b6b66;
      }
      .lane.scored-you {
        animation: scoreYou 0.6s ease;
      }
      .lane.scored-foe {
        animation: scoreFoe 0.6s ease;
      }
      @keyframes scoreYou {
        40% {
          box-shadow:
            inset 0 0 0 3px #57d98a,
            0 0 20px #57d98a99;
          background: #57d98a22;
        }
      }
      @keyframes scoreFoe {
        40% {
          box-shadow:
            inset 0 0 0 3px #ff6b6b,
            0 0 20px #ff6b6b99;
          background: #ff6b6b22;
        }
      }
      .slots {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center; /* cards centered; sized to fit, never scroll */
        justify-content: flex-start;
        min-height: 0;
        padding: 3px 3px;
      }
      .slots.foe {
        justify-content: flex-end;
      }
      .banner {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 6px;
        border-top: 1px solid #23303f;
        border-bottom: 1px solid #23303f;
        background: #0d131b;
      }
      .pw {
        font-size: 19px;
        font-weight: 800;
        min-width: 24px;
        text-align: center;
        transition: color 0.2s;
      }
      .pw.foe {
        color: var(--bad);
      }
      .pw.you {
        color: var(--good);
      }
      .pw.dim {
        color: #3f4c5c;
      }
      .arrow {
        font-size: 10px;
        color: var(--dim);
      }
      /* arena modifier chip pinned to the top of a lane */
      .lanemod {
        flex: 0 0 auto;
        align-self: center;
        max-width: calc(100% - 6px);
        margin-top: 3px;
        font-size: 9px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 2px 8px;
        border-radius: 20px;
        border: 1px solid #3a2f14;
        background: #171207;
        color: var(--amber);
        cursor: pointer;
      }
      .lanemod.none {
        visibility: hidden;
      }
      .lanemod.firing {
        animation: firing 0.42s;
      }

      /* CARDS — 2:3 art ratio, sized to fit lane width AND board height */
      .slot {
        width: var(--cw);
        aspect-ratio: 2/3;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .slot.empty {
        border: 1px dashed #2b3542;
        background: #121821;
      }
      .slot.empty.targetable {
        border: 1.5px dashed var(--amber);
        box-shadow: 0 0 10px #f4b74055;
        animation: pulse 1.1s infinite;
      }
      /* drag-and-drop targets */
      .slot.empty.dropok {
        border: 1.5px dashed var(--amber);
        box-shadow: 0 0 10px #f4b74055;
      }
      .slot.empty.drophover {
        border: 2px solid var(--amber);
        background: #f4b74022;
        box-shadow: 0 0 18px var(--amber);
        transform: scale(1.05);
      }
      .dragghost {
        position: fixed;
        width: 78px;
        aspect-ratio: 2/3;
        border-radius: 9px;
        transform: translate(-50%, -55%) rotate(-4deg);
        background-size: cover;
        background-position: center top;
        background-color: #222a35;
        border: 2px solid var(--amber);
        box-shadow: 0 10px 26px #000c;
        pointer-events: none;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        opacity: 0.95;
      }
      .slot.filled {
        border: 1px solid #3a4658;
        background: #222a35;
        box-shadow: 0 2px 6px #0007;
      }
      .slot.back {
        border: 1px solid #33465c;
        background: repeating-linear-gradient(
          45deg,
          #1a2735,
          #1a2735 5px,
          #16202b 5px,
          #16202b 10px
        );
      }
      .slot .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .slot .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 45%, #000c);
      }
      .slot .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        opacity: 0.16;
      }
      .slot .cost {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px #000a;
      }
      .slot .perk {
        position: absolute;
        top: 4px;
        right: 5px;
        font-size: 15px;
        text-shadow: 0 1px 2px #000;
      }
      .slot .atk {
        position: absolute;
        bottom: 1px;
        left: 5px;
        font-size: 22px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 4px #000;
      }
      .slot .pow {
        position: absolute;
        bottom: 1px;
        right: 5px;
        font-size: 24px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 4px #000;
        transition: color 0.15s;
      }
      .slot .pow.buffed {
        color: var(--good);
      }
      .slot .pow.debuffed {
        color: var(--bad);
      }
      .slot.staged {
        border: 1.5px dashed var(--amber);
        box-shadow: 0 0 9px #f4b74066;
        animation: stagedPulse 1.6s ease-in-out infinite;
      }
      .slot.staged .art {
        filter: saturate(0.75) brightness(0.85);
      }
      @keyframes stagedPulse {
        50% {
          box-shadow: 0 0 14px #f4b740aa;
        }
      }
      /* "STAGED" ribbon: only while the card awaits the reveal */
      .slot .stagetag {
        display: none;
      }
      .slot.staged .stagetag {
        display: block;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(-8deg);
        background: var(--amber);
        color: #1a1204;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 2px 7px;
        border-radius: 4px;
        box-shadow: 0 2px 6px #000a;
        pointer-events: none;
      }
      .rar-legendary.filled {
        border-color: #e0b04a;
      }
      .rar-epic.filled {
        border-color: #a259e0;
      }
      .rar-rare.filled {
        border-color: #4f9ad6;
      }

      .slot.flipin {
        animation: flipin 0.32s ease;
      }
      @keyframes flipin {
        from {
          transform: rotateY(85deg) scale(0.9);
          opacity: 0.1;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .slot.firing {
        animation: firing 0.42s;
      }
      @keyframes firing {
        50% {
          box-shadow:
            0 0 14px var(--amber),
            0 0 0 2px var(--amber);
        }
      }
      .slot.flash-buff {
        animation: fb 0.55s;
      }
      @keyframes fb {
        40% {
          box-shadow:
            0 0 16px #57d98a,
            inset 0 0 0 2px #57d98a;
        }
      }
      .slot.flash-debuff {
        animation: fd 0.55s;
      }
      @keyframes fd {
        40% {
          box-shadow:
            0 0 16px #ff6b6b,
            inset 0 0 0 2px #ff6b6b;
        }
      }
      .slot.clash {
        animation: clash 0.4s;
        z-index: 5;
      }
      @keyframes clash {
        30% {
          transform: translateY(5px) scale(0.94);
        }
        55% {
          box-shadow:
            0 0 14px #ff6b6b,
            inset 0 0 0 2px #ff6b6b;
        }
      }
      .slot.dying {
        animation: die 0.45s forwards;
        z-index: 6;
      }
      @keyframes die {
        30% {
          box-shadow: 0 0 20px #ff6b6b;
          filter: brightness(1.5);
        }
        100% {
          transform: scale(0.2) rotate(14deg);
          opacity: 0;
        }
      }
      .pow.ticking {
        animation: tick 0.32s;
      }
      @keyframes tick {
        40% {
          transform: scale(1.5);
        }
      }
      @keyframes pulse {
        50% {
          filter: brightness(1.3);
        }
      }
      .float {
        position: fixed;
        z-index: 90;
        font-weight: 800;
        font-size: 18px;
        pointer-events: none;
        text-shadow: 0 2px 5px #000;
        animation: floatup 0.9s ease forwards;
      }
      .float.pos {
        color: #7bf0a4;
      }
      .float.neg {
        color: #ff8a8a;
      }
      @keyframes floatup {
        0% {
          transform: translateY(4px);
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        100% {
          transform: translateY(-42px);
          opacity: 0;
        }
      }

      .msgbar {
        text-align: center;
        padding: 3px 8px;
        color: var(--dim);
        font-size: 11.5px;
        min-height: 18px;
        border-top: 1px solid var(--line);
      }
      .msgbar.err {
        color: var(--bad);
      }
      .youbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--dim);
      }
      .pips {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        max-width: 120px;
      }
      .pip {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2a3340;
        border: 1px solid #3a4658;
      }
      .pip.on {
        background: var(--amber);
        border-color: var(--amber);
        box-shadow: 0 0 5px #f4b74088;
      }
      .youbar .grow {
        margin-left: auto;
      }

      /* hand — horizontal scroll strip of 2:3 cards */
      /* hand = overlapping "held deck"; only the tops peek out. Tap -> modal. */
      .hand {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px 8px 4px;
        height: 92px; /* clips the cards so only their tops show */
        overflow: hidden;
        flex: 0 0 auto;
      }
      .hcard {
        width: var(--hw);
        aspect-ratio: 2/3;
        border-radius: 9px;
        position: relative;
        overflow: hidden;
        background: #222a35;
        border: 1px solid #3a4658;
        box-shadow: -3px 3px 8px #0008;
        flex: 0 0 auto;
        margin-left: calc(var(--hw) * -0.52); /* fan overlap */
        transition:
          transform 0.12s,
          margin 0.12s;
        cursor: grab;
        touch-action: none; /* let pointer-drag work on touch / pen without scrolling */
      }
      .hcard:first-child {
        margin-left: 0;
      }
      .hcard:active {
        transform: translateY(-10px);
        z-index: 20;
      }
      .hcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .hcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 30%, #000e);
      }
      .hcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        opacity: 0.15;
      }
      .hcard .cost {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hcard .perk {
        position: absolute;
        top: 4px;
        right: 5px;
        font-size: 12px;
      }
      .hcard .nm {
        position: absolute;
        top: 6px;
        left: 26px;
        right: 8px;
        font-size: 9px;
        text-align: center;
        text-shadow: 0 1px 2px #000;
      }
      .hcard .txt {
        position: absolute;
        left: 5px;
        right: 5px;
        bottom: 26px;
        font-size: 8px;
        line-height: 1.15;
        text-align: center;
        color: #e2eaf2;
        text-shadow: 0 1px 2px #000;
      }
      .hcard .atk {
        position: absolute;
        bottom: 2px;
        left: 6px;
        font-size: 18px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 3px #000;
      }
      .hcard .pow {
        position: absolute;
        bottom: 2px;
        right: 6px;
        font-size: 18px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 3px #000;
      }
      .hcard.playable:active {
        transform: translateY(-6px);
      }
      .hcard.unplayable {
        filter: grayscale(0.6) brightness(0.62);
      }
      .hcard.selected {
        box-shadow:
          0 0 0 3px var(--amber),
          0 0 14px #f4b740aa;
        transform: translateY(-12px);
        z-index: 15;
      }

      /* full-card modal */
      .cardmodal {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
      }
      .cardmodal.hidden {
        display: none;
      }
      .cmbg {
        position: absolute;
        inset: 0;
        background: #000d;
        backdrop-filter: blur(2px);
      }
      .cmwrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .bigcard {
        width: min(74vw, 52vh, 380px);
        aspect-ratio: 2/3;
        border-radius: 16px;
        position: relative;
        overflow: hidden;
        background: #222a35;
        border: 2px solid #3a4658;
        box-shadow: 0 12px 40px #000b;
      }
      .bigcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .bigcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 55%, #000d);
      }
      .bigcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 90px;
        opacity: 0.15;
      }
      .bigcard .cost {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 8px #000a;
      }
      .bigcard .perk {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 26px;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .nm {
        position: absolute;
        top: 12px;
        left: 60px;
        right: 44px;
        font-size: 17px;
        font-weight: 700;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .txt {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 44px;
        font-size: 13px;
        line-height: 1.3;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }
      .bigcard .atk {
        position: absolute;
        bottom: 6px;
        left: 12px;
        font-size: 38px;
        font-weight: 800;
        color: #ff9d6b;
        text-shadow: 0 1px 4px #000;
      }
      .bigcard .pow {
        position: absolute;
        bottom: 6px;
        right: 12px;
        font-size: 40px;
        font-weight: 800;
        color: var(--amber);
        text-shadow: 0 1px 4px #000;
      }
      .cmbtns {
        display: flex;
        gap: 12px;
      }
      .rar-legendary {
        border-color: #e0b04a;
      }
      .rar-epic {
        border-color: #a259e0;
      }
      .rar-rare {
        border-color: #4f9ad6;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: #000c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        z-index: 50;
        padding: 18px;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay h1 {
        font-size: 40px;
        margin: 0;
      }
      .win {
        color: var(--good);
      }
      .lose {
        color: var(--bad);
      }
      .setup {
        background: #141a22;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }
      .laneres {
        display: flex;
        gap: 8px;
      }
      .laneres div {
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-weight: 700;
        font-size: 13px;
      }
      .reward {
        font-size: 13px;
        font-weight: 700;
        color: var(--amber);
      }
      .reward.win {
        color: var(--good);
      }
      /* level-up ceremony */
      .setup.ceremony {
        max-height: 92vh;
        overflow-y: auto;
        gap: 9px;
      }
      .ceremony .bigcard {
        width: min(58vw, 36vh, 280px);
        animation: pickin 0.35s backwards;
      }
      .statup {
        color: var(--good);
        font-weight: 800;
      }
      /* how-to-play briefing */
      .setup.howto {
        max-width: 420px;
        max-height: 86vh;
        overflow-y: auto;
        gap: 9px;
      }
      .howstep {
        font-size: 12.5px;
        line-height: 1.45;
        color: #dbe4ee;
        text-align: left;
        background: #10161f;
        border: 1px solid #232e3c;
        border-radius: 9px;
        padding: 8px 11px;
      }
      .howmod {
        font-size: 12px;
        line-height: 1.4;
        color: var(--amber);
        text-align: left;
      }
      /* pick-1-of-3 unlock reward (result screen + home reclaim) */
      .pickwrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .pickrow {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .pickrow .hcard {
        width: min(112px, 26vw);
        margin-left: 0;
        cursor: pointer;
        animation: pickin 0.4s backwards;
      }
      .pickrow .hcard:nth-child(2) {
        animation-delay: 0.09s;
      }
      .pickrow .hcard:nth-child(3) {
        animation-delay: 0.18s;
      }
      @keyframes pickin {
        from {
          transform: translateY(16px) scale(0.92);
          opacity: 0;
        }
      }
      .pickrow .hcard:hover {
        box-shadow:
          0 0 0 2px var(--amber),
          0 0 16px #f4b74088;
        transform: translateY(-4px);
      }
      /* L3 boon picker (result screen + library popup) */
      .choicerow {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 13px;
        font-weight: 700;
        color: var(--amber);
      }

      /* campaign + library panels */
      .menu {
        position: absolute;
        inset: 0;
        background: #0e1116;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 8px;
      }
      .menuhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 17px;
        padding: 2px 4px;
      }
      .lvlist {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .lvl {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #171e28;
        cursor: pointer;
      }
      .lvl:active {
        transform: scale(0.99);
      }
      .lvl.locked {
        opacity: 0.5;
        cursor: default;
        background: #10141b;
      }
      .lvl.beaten {
        border-color: #2e5a3f;
      }
      .lvnum {
        font-weight: 800;
        min-width: 42px;
      }
      .lvname {
        flex: 1;
        display: flex;
        flex-direction: column;
        font-weight: 700;
      }
      .lvname small {
        font-weight: 400;
        color: var(--dim);
        font-size: 11px;
      }
      .lvdiff {
        font-size: 11px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 20px;
        border: 1px solid var(--line);
      }
      .lvmods {
        font-size: 13px;
        letter-spacing: 2px;
        flex: 0 0 auto;
      }
      .lvdraw {
        font-size: 10px;
        letter-spacing: 0;
        color: var(--dim);
        margin-left: 3px;
      }
      .actdiv {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 6px 0 -1px;
      }
      .actdiv::before,
      .actdiv::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .lvstars {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--amber);
      }
      /* star-objective result lines */
      .objrow {
        font-size: 12px;
        font-weight: 700;
        color: var(--dim);
      }
      .objrow.got {
        color: var(--good);
      }
      .objrow.had {
        color: var(--amber);
        opacity: 0.75;
      }
      .d-Easy {
        color: var(--good);
      }
      .d-Normal {
        color: #cfe08a;
      }
      .d-Hard {
        color: var(--amber);
      }
      .d-VeryHard {
        color: #ff9d6b;
      }
      .d-Boss {
        color: var(--bad);
        border-color: var(--bad);
      }
      .libgrid {
        flex: 1;
        min-height: 0; /* allow flex child to shrink so overflow-y scrolling engages */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 per row */
        grid-auto-rows: max-content; /* rows hug card height (don't divide the viewport) */
        gap: 14px;
        align-content: start;
        align-items: start; /* don't stretch cards to row height — preserves their 2:3 aspect-ratio */
        padding: 6px 4px 18px;
        perspective: 1000px;
      }
      .libcard {
        aspect-ratio: 2/3;
        border-radius: 14px;
        position: relative;
        overflow: hidden;
        border: 2px solid #3a4658;
        background: #222a35;
        cursor: pointer;
        box-shadow: 0 4px 12px #0008;
        transition:
          transform 0.3s cubic-bezier(0.2, 0.7, 0.3, 1.3),
          box-shadow 0.3s ease,
          border-color 0.3s ease;
        animation: libpop 0.45s both;
        animation-delay: calc(var(--i, 0) * 26ms);
        will-change: transform;
      }
      @keyframes libpop {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.93);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .libcard.rar-legendary {
        --rarcol: #e6b84e;
      }
      .libcard.rar-epic {
        --rarcol: #b06bf0;
      }
      .libcard.rar-rare {
        --rarcol: #4f9ad6;
      }
      .libcard.rar-common {
        --rarcol: #8090a0;
      }
      .rar-common.filled {
        border-color: #6b7a8c;
      }
      .libcard:active {
        transform: scale(0.97);
      }
      .libcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      .libcard .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 55%, #000d);
      }
      .libcard .shine {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          #fff0 32%,
          #ffffff55 48%,
          #fff0 64%
        );
        transform: translateX(-130%);
        opacity: 0;
      }
      @keyframes shine {
        0% {
          transform: translateX(-130%);
          opacity: 0;
        }
        18% {
          opacity: 0.85;
        }
        100% {
          transform: translateX(130%);
          opacity: 0;
        }
      }
      .libcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        opacity: 0.5;
      }
      .libcard.lockedcard .art {
        filter: grayscale(1) brightness(0.4);
        transition:
          transform 0.5s,
          filter 0.4s;
      }
      .lockveil {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #0007;
        z-index: 3;
      }
      .lockveil .lk {
        font-size: 34px;
        transition: transform 0.3s;
      }
      .lockveil .unlocklbl {
        font-size: 12px;
        color: #cdd8e4;
        font-weight: 700;
      }
      .libcard .cost {
        position: absolute;
        top: 7px;
        left: 7px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 6px #000a;
        z-index: 4;
        transition: transform 0.3s;
      }
      .libcard .lvbadge {
        position: absolute;
        top: 7px;
        right: 7px;
        font-size: 13px;
        font-weight: 800;
        background: #000b;
        border: 1px solid var(--amber);
        color: var(--amber);
        border-radius: 6px;
        padding: 1px 6px;
        z-index: 4;
      }
      /* resting state: slim name bar keeps ~75% of the art visible */
      .libcard .namebar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        padding: 22px 8px 11px;
        text-align: center;
        font-size: 12.5px;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: #fff;
        text-shadow:
          0 1px 4px #000,
          0 0 10px #000c;
        background: linear-gradient(180deg, #0000, #000c 72%);
        transition:
          opacity 0.25s ease,
          transform 0.3s ease;
      }
      /* hover: rich detail panel slides up over the lower art */
      .libcard .reveal {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        padding: 12px 8px 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        background: linear-gradient(180deg, #0000, #000d 42%, #000f);
        transform: translateY(102%);
        opacity: 0;
        transition:
          transform 0.34s cubic-bezier(0.2, 0.7, 0.3, 1.15),
          opacity 0.28s ease;
      }
      .libcard .reveal .rstats {
        display: flex;
        gap: 18px;
        font-size: 23px;
        font-weight: 800;
        line-height: 1;
      }
      .libcard .reveal .atk {
        color: #ff9d6b;
        text-shadow: 0 1px 4px #000;
      }
      .libcard .reveal .pow {
        color: var(--amber);
        text-shadow: 0 1px 4px #000;
      }
      .libcard .reveal .rperk {
        font-size: 10.5px;
        color: #dce6f0;
        line-height: 1.3;
        text-align: center;
      }
      .libcard .reveal .rhint {
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--amber);
        opacity: 0.85;
      }
      .libcard .reveal .rname {
        font-size: 13px;
        font-weight: 800;
        text-align: center;
        line-height: 1.15;
        text-shadow: 0 1px 3px #000;
        margin-bottom: 1px;
      }
      /* view-mode toggle (segmented control) */
      .libtoggle {
        display: flex;
        gap: 8px;
        margin: 2px 2px 12px;
        flex: 0 0 auto;
      }
      /* ---- deck builder (library doubles as deck editor) ---- */
      .deckbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 2px 10px;
        flex: 0 0 auto;
      }
      .deckcount {
        font-weight: 800;
        font-size: 13px;
        color: var(--dim);
        white-space: nowrap;
      }
      .deckcount.ok {
        color: var(--amber);
      }
      .deckhint {
        flex: 1;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.25;
      }
      .deckhint.warn {
        color: var(--bad);
      }
      .deckbtn {
        position: absolute;
        top: 5px;
        right: 5px;
        z-index: 3;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #0e1116cc;
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .deckbtn.in {
        background: var(--amber);
        border-color: var(--amber);
        color: #201a08;
      }
      .gcard.indeck {
        border-color: var(--amber);
        box-shadow:
          0 0 0 1px var(--amber),
          0 4px 12px #0008;
      }
      .libcard.indeck {
        outline: 2px solid var(--amber);
        outline-offset: -2px;
      }
      .segbtn {
        flex: 1;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1.5px solid #3a4658;
        background: #1a212b;
        color: var(--dim);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition:
          color 0.2s,
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.2s;
      }
      .segbtn.on {
        border-color: var(--amber);
        color: var(--amber);
        background: #2a2418;
        box-shadow: 0 0 10px #f4b74033;
      }
      /* FULL view: the entire collection as an art wall — every card fits in ONE screen,
         no scrolling. Column count is computed in JS (fitFullView) to fill the viewport. */
      .libgrid.full {
        overflow: hidden;
        gap: 6px;
        padding: 4px 2px 6px;
      }
      .libgrid.full .libcard {
        border-radius: 8px;
        border-width: 1.5px;
        box-shadow: 0 2px 6px #0007;
        animation-delay: calc(var(--i, 0) * 11ms);
      }
      /* at this size only the art reads — strip the overlays; tap a card for full details */
      .libgrid.full .libcard .namebar,
      .libgrid.full .libcard .cost,
      .libgrid.full .libcard .lvbadge,
      .libgrid.full .libcard .reveal,
      .libgrid.full .libcard .xpbar,
      .libgrid.full .libcard .xpmax,
      .libgrid.full .libcard .lockveil .unlocklbl {
        display: none;
      }
      .libgrid.full .libcard .lockveil .lk {
        font-size: 18px;
      }
      /* GRID view: clean full-art thumbnail + caption BELOW — nothing overlaps the art */
      .gcard {
        border-radius: 12px;
        overflow: hidden;
        background: #151b24;
        border: 2px solid #3a4658;
        cursor: pointer;
        box-shadow: 0 4px 12px #0008;
        display: flex;
        flex-direction: column;
        animation: libpop 0.45s both;
        animation-delay: calc(var(--i, 0) * 26ms);
        transition:
          transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1.3),
          box-shadow 0.28s ease,
          border-color 0.28s ease;
        will-change: transform;
      }
      .gcard.rar-legendary {
        --rarcol: #e6b84e;
      }
      .gcard.rar-epic {
        --rarcol: #b06bf0;
      }
      .gcard.rar-rare {
        --rarcol: #4f9ad6;
      }
      .gcard.rar-common {
        --rarcol: #8090a0;
      }
      .gcard:active {
        transform: scale(0.98);
      }
      .gcard .thumb {
        position: relative;
        aspect-ratio: 2/3;
        overflow: hidden;
      }
      .gcard .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      .gcard.lockedcard .art {
        filter: grayscale(1) brightness(0.45);
      }
      .gcard .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 54px;
        opacity: 0.5;
      }
      .gcard .shine {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          #fff0 32%,
          #ffffff55 48%,
          #fff0 64%
        );
        transform: translateX(-130%);
        opacity: 0;
      }
      .gcard .cap {
        padding: 7px 8px 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .gcard .caprow {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gcard .ccost {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #bfe0ff, #3d6f9c);
        color: #08131f;
        font-weight: 800;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gcard .cnm {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gcard .cnm.dim {
        color: var(--dim);
      }
      .gcard .clv {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 800;
        color: var(--amber);
        border: 1px solid var(--amber);
        border-radius: 5px;
        padding: 0 5px;
      }
      .gcard .cstat {
        font-size: 15px;
        font-weight: 800;
      }
      .gcard .cstat.atk {
        color: #ff9d6b;
      }
      .gcard .cstat.pow {
        color: var(--amber);
        margin-left: auto;
      }
      .gcard .clk {
        font-size: 11px;
        font-weight: 700;
        color: var(--dim);
      }
      .gcard .capxp {
        height: 5px;
        border-radius: 3px;
        background: #0009;
        overflow: hidden;
      }
      .gcard .capxp i {
        display: block;
        height: 100%;
        background: var(--good);
        transition: width 0.4s ease;
      }
      .gcard .capxp.max i {
        background: var(--amber);
      }
      @media (hover: hover) {
        .gcard:hover {
          transform: translateY(-6px) scale(1.03);
          border-color: var(--rarcol, #4f9ad6);
          box-shadow:
            0 12px 28px #000b,
            0 0 20px -3px var(--rarcol, #4f9ad6);
          z-index: 4;
        }
        .gcard:hover .art {
          transform: scale(1.06);
        }
        .gcard.filled:hover .shine {
          animation: shine 0.9s ease;
        }
      }
      @media (hover: hover) {
        .libcard:hover {
          transform: translateY(-9px) scale(1.045);
          z-index: 6;
          border-color: var(--rarcol, #4f9ad6);
        }
        .libcard.filled:hover {
          box-shadow:
            0 14px 32px #000c,
            0 0 24px -2px var(--rarcol, #4f9ad6);
        }
        .libcard:hover .art {
          transform: scale(1.1);
        }
        .libcard.lockedcard:hover .art {
          filter: grayscale(0.7) brightness(0.62);
        }
        .libcard:hover .namebar {
          opacity: 0;
          transform: translateY(10px);
        }
        .libcard.filled:hover .reveal {
          transform: none;
          opacity: 1;
        }
        .libcard:hover .cost {
          transform: scale(1.1);
        }
        .libcard.lockedcard:hover .lockveil .lk {
          transform: scale(1.15) rotate(-6deg);
        }
        .libcard.filled:hover .shine {
          animation: shine 0.9s ease;
        }
      }
      .libcard .xpbar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: #0009;
        z-index: 5;
      }
      .libcard .xpbar i {
        display: block;
        height: 100%;
        background: var(--good);
        transition: width 0.4s ease;
      }
      .libcard .xpmax {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: var(--amber);
        z-index: 5;
      }
      /* detail-modal extras */
      .dcap {
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--dim);
        font-size: 13px;
      }
      .dtag {
        font-size: 14px;
        font-weight: 700;
      }
      .xpbar.big {
        width: min(74vw, 380px);
        height: 10px;
        border-radius: 6px;
        overflow: hidden;
        background: #0009;
      }
      .xpbar.big i {
        display: block;
        height: 100%;
        background: var(--good);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <span class="brand">◆ SMUDGE</span>
        <span class="turn" id="turn"></span>
        <span class="timer" id="timer"></span>
        <span class="record" id="record"></span>
        <button
          class="btn newbtn"
          onclick="showHowTo(false)"
          title="How to play"
        >
          ?
        </button>
        <button
          class="btn newbtn"
          onclick="showOptions()"
          title="Sound options"
        >
          ⚙
        </button>
        <button class="btn newbtn" onclick="openHome()">Menu</button>
      </div>

      <div class="lanes" id="lanes"></div>

      <div class="msgbar" id="msg"></div>
      <div class="youbar">
        <span class="pips" id="energyPips"></span>
        <span id="energyNum"></span>
        <span class="grow"></span>
        <button class="btn" id="resetBtn" onclick="resetTurn()">↺</button>
        <button class="btn primary" id="endBtn" onclick="endTurn()">
          Reveal ▶
        </button>
      </div>
      <div class="hand" id="hand"></div>
    </div>

    <div class="overlay" id="overlay"><div id="over"></div></div>
    <div class="cardmodal hidden" id="cardModal">
      <div class="cmbg" onclick="closeCard()"></div>
      <div class="cmwrap" id="cmwrap"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let STATE = null,
        SEL = null,
        ANIMATING = false;
      const SP = () => (STATE && STATE.slotsPerLane) || 3;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      /* ============ SOUND FX ============ */
      const SFX = (() => {
        // name -> [file, per-sound base volume]
        const SPEC = {
          // UI & navigation
          click: ["/sfx/Button_click.mp3", 0.5],
          hover: ["/sfx/Button_hover.mp3", 0.22],
          menuOpen: ["/sfx/menu_open.mp3", 0.6],
          menuClose: ["/sfx/Menu_close.mp3", 0.6],

      // Full view = the whole collection in ONE screen. Pick the fewest columns
      // (=> biggest cards) whose resulting rows still fit the grid's height, no scroll.
      function fitFullView() {
        const grid = document.querySelector(".libgrid.full");
        if (!grid) return;
        const n = POOL.length;
        const cs = getComputedStyle(grid);
        const gap = parseFloat(cs.rowGap) || 6;
        const W =
          grid.clientWidth -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight);
        const H =
          grid.clientHeight -
          parseFloat(cs.paddingTop) -
          parseFloat(cs.paddingBottom);
        if (W <= 0 || H <= 0) return;
        const ASPECT = 1.5; // card height / width (2:3)
        let cols = n;
        for (let c = 1; c <= n; c++) {
          const w = (W - (c - 1) * gap) / c;
          const rows = Math.ceil(n / c);
          const need = rows * (w * ASPECT) + (rows - 1) * gap;
          if (need <= H) {
            cols = c;
            break;
          }
        }
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      }

        if (document.querySelector(".libgrid.full")) fitFullView();

            per panel you lead</b> (🏆 Golden pays 2). Most points after 9
            rounds wins!</div>
          ${mods ? `<div class="reward" style="margin-top:4px">This match's panels:</div>${mods}` : ""}
          <div class="cmbtns"><button class="btn primary" onclick="closeHowTo()">${intro ? "Fight! ▶" : "◀ Back to the match"}</button></div>
        </div>`;
        $("overlay").classList.remove("hidden");
      }
      function closeHowTo() {
        if (!PROG.seenHowTo) {
          PROG.seenHowTo = true;
          saveProg();
        }
        SFX.play("menuClose");
        $("overlay").classList.add("hidden");
        if (_howtoIntro) {
          _howtoIntro = false;
          playTurnStartCues(); // opening hand + first round begins
        }
      }

      function finishMatch() {
        if (MATCH_RESOLVED) return;
        MATCH_RESOLVED = true;
        const won = STATE.winner === "human";
        // EARNED XP: cards that hit the board get the full award, +1 per kill
        // (capped at +2) and +1 for surviving to the end; benched cards only
        // trickle +1 on a win. Servers without matchStats fall back to the
        // old flat award so a stale token still resolves.
        const ms = STATE.matchStats;
        const played = ms ? new Set(ms.played) : null;
        const survived = ms ? new Set(ms.survived) : null;
        const levelUps = [];
        LAST.deck.forEach((d) => {
          const p = PROG.cards[d.id];
          if (!p) return;
          let gain;
          if (!ms) gain = won ? 3 : 1;
          else if (played.has(d.id))
            gain =
              (won ? 3 : 1) +
              Math.min(2, (ms.kills && ms.kills[d.id]) || 0) +
              (survived.has(d.id) ? 1 : 0);
          else gain = won ? 1 : 0;
          p.xp += gain;
          while (p.lvl < LVL_CAP && p.xp >= xpToNext(p.lvl)) {
            p.xp -= xpToNext(p.lvl);
            p.lvl++;
            levelUps.push({ id: d.id, lvl: p.lvl });
          }
        });
        // a win banks the next level, offers a pick-1-of-3 card reward, and
        // checks this level's star objectives (each new star = a bonus pick)
        let starResults = [];
        if (won) {
          PROG.beaten[LAST.level] = true;
          if (LAST.level + 1 < LEVELS.length)
            PROG.unlocked = Math.max(PROG.unlocked, LAST.level + 1);
          PROG.pendingPicks.push({ level: LAST.level, offers: null });
          if (ms) {
            const ctx = starCtx();
            starResults = (STARS[LAST.level] || []).map((def, k) => {
              const had = !!(PROG.stars[LAST.level] || [])[k];
              const got = !had && !!def.check(ctx);
              if (got) {
                PROG.stars[LAST.level] = PROG.stars[LAST.level] || [
                  false,
                  false,
                ];
                PROG.stars[LAST.level][k] = true;
                PROG.pendingPicks.push({ level: LAST.level, offers: null });
              }
              return { desc: def.desc, had, got };
            });
          }
        }
        saveProg();
        showResult(won, levelUps, starResults);
      }
      // ---- pick-1-of-3 unlock rewards (a queue: win pick + star bonuses) ----
      function pickerHTML() {
        const q = PROG.pendingPicks || [];
        while (q.length) {
          const pp = q[0];
          if (!Array.isArray(pp.offers)) {
            // offers are drawn when first shown, so back-to-back picks in
            // the queue never offer a card an earlier pick already granted
            pp.offers = offersFor(pp.level);
            saveProg();
          }
          const offers = pp.offers
            .map(byId)
            .filter((c) => c && !PROG.cards[c.id]);
          if (!offers.length) {
            q.shift(); // stale: bad ids, already owned, or pool exhausted
            saveProg();
            continue;
          }
          const tiles = offers
            .map(
              (
                c,
              ) => `<div class="hcard rar-${c.rarity}" onclick="pickUnlock(${c.id})">${artOrGlyph(c)}<div class="cost">${c.cost}</div>
                ${c.text ? `<div class="perk">${glyph(c)}</div>` : ""}<div class="nm">${c.name}</div>
                ${c.text ? `<div class="txt">${c.text}</div>` : ""}<div class="atk">${c.attack}</div><div class="pow">${c.power}</div></div>`,
            )
            .join("");
          const more =
            q.length > 1
              ? ` <small>(+${q.length - 1} more waiting)</small>`
              : "";
          return `<div id="pickwrap" class="pickwrap">
            <div class="reward win">★ Reward — tap ONE card to keep:${more}</div>
            <div class="pickrow">${tiles}</div></div>`;
        }
        return "";
      }
      function pickUnlock(id) {
        const q = PROG.pendingPicks || [];
        const pp = q[0];
        if (!pp || !(pp.offers || []).includes(id) || PROG.cards[id]) return;
        PROG.cards[id] = { xp: 0, lvl: 1, choice: null };
        q.shift();
        saveProg();
        SFX.play("cardUnlock");
        const w = $("pickwrap");
        const next = pickerHTML(); // next queued reward, if any
        if (w) {
          if (next) w.outerHTML = next;
          else
            w.innerHTML = `<div class="reward win">★ Unlocked: ${byId(id).name} — the rest return to the reward pool.</div>`;
        }
        if (!next)
          document
            .querySelectorAll("[data-pickgate]")
            .forEach((b) => (b.disabled = false));
      }
      // Permanent L3 boon: +1 Attack or +1 Power, picked once per card.
      function chooseUpgrade(id, ch, btn) {
        const p = PROG.cards[id];
        if (!p || p.choice) return;
        p.choice = ch;
        saveProg();
        SFX.play("cardLevelUp");
        const row = btn && btn.closest(".choicerow");
        if (row)
          row.innerHTML = `⬆ ${byId(id).name}: ${ch === "attack" ? "+1 ⚔ Attack" : "+1 ◆ Power"} locked in`;
      }

      // Match end: first a LEVEL-UP CEREMONY (one big card at a time, boon
      // picks inline, Skip all anytime), then the result summary screen.
      function showResult(won, levelUps, starResults) {
        runCeremony(levelUps, () => showResultSummary(won, starResults));
      }
      /* ---- level-up ceremony ---- */
      let CEREMONY = null; // {steps:[{id, from, to}], i, done}
      function runCeremony(levelUps, done) {
        // one step per card: first gained level - 1 -> last gained level
        const steps = [];
        const at = {};
        (levelUps || []).forEach((u) => {
          if (at[u.id] === undefined) {
            at[u.id] = steps.length;
            steps.push({ id: u.id, from: u.lvl - 1, to: u.lvl });
          } else steps[at[u.id]].to = u.lvl;
        });
        if (!steps.length) {
          done();
          return;
        }
        CEREMONY = { steps, i: 0, done };
        ceremonyStep();
      }
      function ceremonyStep() {
        const cm = CEREMONY;
        if (!cm || cm.i >= cm.steps.length) {
          const done = cm && cm.done;
          CEREMONY = null;
          if (done) done();
          return;
        }
        SFX.play("cardLevelUp");
        const st = cm.steps[cm.i];
        const c = byId(st.id);
        const p = PROG.cards[st.id];
        const ch = p ? p.choice : null;
        const boon = p && needsChoice(p);
        const a0 = atkAt(c, st.from, ch),
          a1 = atkAt(c, st.to, ch),
          p0 = powAt(c, st.from, ch),
          p1 = powAt(c, st.to, ch);
        const dAtk =
          a1 > a0 ? ` <span class="statup">⚔ ${a0} → ${a1}</span>` : "";
        const dPow =
          p1 > p0 ? ` <span class="statup">◆ ${p0} → ${p1}</span>` : "";
        const perkUp =
          st.to >= 4 && st.from < 4 && c.textPlus
            ? `<div class="dtag statup">✦ perk upgraded: ${c.textPlus}</div>`
            : "";
        const need = p && p.lvl < LVL_CAP ? xpToNext(p.lvl) : 0;
        const bar = need
          ? `<div class="xpbar big"><i style="width:${Math.min(100, (100 * p.xp) / need)}%"></i></div>`
          : `<div class="dtag" style="color:var(--amber)">MAX LEVEL</div>`;
        const art = c.art
          ? `<div class="art" style="background-image:url('${c.art}')"></div><div class="veil"></div>`
          : `<div class="glyph">${glyph(c)}</div>`;
        const txt = textAt(c, st.to);
        const action = boon
          ? `<div class="choicerow">🔱 L3 boon — pick one:
              <button class="btn primary" onclick="ceremonyBoon(${st.id},'attack')">+1 ⚔</button>
              <button class="btn primary" onclick="ceremonyBoon(${st.id},'power')">+1 ◆</button></div>`
          : `<button class="btn primary" onclick="ceremonyNext()">Next ▶</button>`;
        $("over").innerHTML = `<div class="setup ceremony">
          <div class="hint">Card ${cm.i + 1}/${cm.steps.length}</div>
          <h1 class="win" style="font-size:24px">⬆ LEVEL UP!</h1>
          <div class="bigcard rar-${c.rarity}">${art}
            <div class="cost">${c.cost}</div>
            <div class="lvbadge" style="font-size:14px">L${st.to}</div>
            <div class="nm">${c.name}</div>${txt ? `<div class="txt">${txt}</div>` : ""}
            <div class="atk">⚔ ${a1}</div><div class="pow">${p1}</div></div>
          <div class="dtag">${c.name} — Level ${st.from} → <b>L${st.to}</b>${dAtk}${dPow}</div>
          ${perkUp}${bar}
          <div class="cmbtns">${action}
            <button class="btn" onclick="ceremonySkip()">Skip all ▶▶</button></div>
        </div>`;
        $("overlay").classList.remove("hidden");
      }
      function ceremonyNext() {
        if (!CEREMONY) return;
        CEREMONY.i++;
        ceremonyStep();
      }
      function ceremonyBoon(id, ch) {
        chooseUpgrade(id, ch);
        ceremonyNext();
      }
      function ceremonySkip() {
        // unpicked boons stay pending — the Library marks them with ⬆
        SFX.play("click");
        if (!CEREMONY) return;
        CEREMONY.i = CEREMONY.steps.length;
        ceremonyStep();
      }
      /* ---- result summary ---- */
      function showResultSummary(won, starResults) {
        const s = STATE;
        const t = won
          ? ["VICTORY", "win"]
          : s.winner === "bot"
            ? ["DEFEAT", "lose"]
            : ["DRAW", "win"];
        const xphint = s.matchStats
          ? `XP — played +${won ? 3 : 1} · kill +1 · survived +1 · benched +${won ? 1 : 0}`
          : `+${won ? 3 : 1} XP to each card you played.`;
        // star objectives: ★ new, ★ already earned (dim), ☆ missed
        const newStars = (starResults || []).filter((r) => r.got).length;
        const stars = (starResults || [])
          .map((r) =>
            r.got
              ? `<div class="objrow got">★ ${r.desc} — <b>NEW!</b> bonus pick earned</div>`
              : r.had
                ? `<div class="objrow had">★ ${r.desc}</div>`
                : `<div class="objrow">☆ ${r.desc}</div>`,
          )
          .join("");
        // the 1-of-3 reward gates the nav buttons until a card is claimed
        const picker = pickerHTML();
        const gate = picker ? "data-pickgate disabled" : "";
        const nextLv = LAST.level + 1;
        const canNext = won && nextLv < LEVELS.length;
        const btns =
          (canNext
            ? `<button class="btn primary" ${gate} onclick="startLevel(${nextLv})">Next ▶</button>`
            : `<button class="btn primary" ${gate} onclick="startLevel(${LAST.level})">${won ? "Play Again" : "Retry"}</button>`) +
          `<button class="btn" ${gate} onclick="showCampaign()">Levels</button>`;
        $("over").innerHTML = `<h1 class="${t[1]}">${t[0]}</h1>
          <div style="font-size:26px;font-weight:800">${s.score.you} – ${s.score.foe}</div>
          <div class="hint">${xphint}</div>
          ${stars}${picker}
          <div class="cmbtns">${btns}</div>`;
        $("overlay").classList.remove("hidden");
        // reward jingle: XP tally → new stars → reward offer → saved
        SFX.play("xpGain");
        let dly = 550;
        if (newStars) {
          setTimeout(() => SFX.play("levelSelect"), dly);
          dly += 500;
        }
        if (picker) {
          setTimeout(() => SFX.play("cardModalOpen"), dly);
          dly += 500;
        }
        setTimeout(() => SFX.play("progressSaved"), dly);
      }

      (async () => {
        try {
          [LEVELS, POOL] = await Promise.all([
            api("/api/levels"),
            api("/api/pool"),
          ]);
          if (!Array.isArray(LEVELS) || !Array.isArray(POOL)) {
            throw new Error(
              (LEVELS && LEVELS.error) ||
                (POOL && POOL.error) ||
                "API returned unexpected data (levels/pool not arrays).",
            );
          }
          loadProg();
          STATE = await api("/api/state");
          if (STATE.started && !STATE.over) render();
          else openHome();
        } catch (e) {
          // Don't leave a black screen — surface the failure so it's debuggable.
          $("over").innerHTML = `<div class="setup">
            <h1 style="font-size:22px" class="lose">⚠ Failed to start</h1>
            <div class="hint">The game server API didn't respond correctly.<br>
              <code style="color:#ff9">${String(e && e.message ? e.message : e)}</code><br>
              Check the browser console (F12) and the /api/ endpoints.</div>
            <button class="btn primary" onclick="location.reload()">Retry</button>
          </div>`;
          $("overlay").classList.remove("hidden");
        }
      })();
    </script>
  </body>
</html>
