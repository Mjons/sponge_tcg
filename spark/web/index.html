<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPARK</title>
    <style>
      :root {
        --bg: #0e1116;
        --felt: #12321f;
        --felt2: #0d251694;
        --line: #2a3340;
        --ink: #e8edf2;
        --dim: #93a1b0;
        --amber: #f4b740;
        --amber2: #7a5a10;
        --red: #e0524e;
        --blue: #4f9ad6;
        --green: #5cbf7a;
        --card: #1b212b;
        --good: #57d98a;
        --bad: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(
          120% 90% at 50% 0%,
          #16202b 0%,
          var(--bg) 70%
        );
        color: var(--ink);
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* header */
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: #0c0f14;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 3px;
        font-size: 20px;
        background: linear-gradient(90deg, var(--amber), #ffe29a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .topbar select {
        background: #161c24;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 6px;
      }
      .topbar label {
        color: var(--dim);
        font-size: 13px;
      }
      button {
        cursor: pointer;
        font-family: inherit;
      }
      .btn {
        background: #1c2530;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 14px;
        font-weight: 600;
      }
      .btn:hover {
        border-color: var(--amber);
      }
      .btn.primary {
        background: linear-gradient(180deg, #f4b740, #c98f1c);
        color: #241a05;
        border: none;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* player strips */
      .strip {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 6px 16px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 210px;
      }
      .arch {
        font-weight: 700;
        text-transform: capitalize;
      }
      .arch.aggro {
        color: var(--red);
      }
      .arch.control {
        color: var(--blue);
      }
      .arch.midrange {
        color: var(--green);
      }
      .life {
        font-size: 26px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .heart {
        color: var(--red);
      }
      .pips {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        max-width: 220px;
      }
      .pip {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #2a3340;
        border: 1px solid #3a4658;
      }
      .pip.on {
        background: var(--amber);
        border-color: var(--amber);
        box-shadow: 0 0 6px #f4b74088;
      }
      .meta {
        color: var(--dim);
        font-size: 13px;
        display: flex;
        gap: 12px;
      }
      .face {
        margin-left: auto;
        padding: 8px 14px;
        border: 1px dashed #3a4658;
        border-radius: 10px;
        color: var(--dim);
        font-size: 13px;
        user-select: none;
      }
      .face.foe.targetable {
        border-color: var(--bad);
        color: var(--bad);
        cursor: crosshair;
        box-shadow: 0 0 12px #ff6b6b55;
        animation: pulse 1.1s infinite;
      }

      /* board */
      .board {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 6px 16px;
        background:
          linear-gradient(
            180deg,
            var(--felt2),
            transparent 30%,
            transparent 70%,
            var(--felt2)
          ),
          radial-gradient(60% 60% at 50% 50%, var(--felt), transparent);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        overflow: hidden;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        min-height: 150px;
        flex-wrap: wrap;
      }
      .row.empty::after {
        content: "— no units —";
        color: #43506080;
        font-size: 13px;
      }
      .divider {
        text-align: center;
        color: #43506080;
        font-size: 12px;
        letter-spacing: 2px;
      }

      /* cards */
      .card {
        position: relative;
        width: 104px;
        height: 146px;
        border-radius: 10px;
        overflow: hidden;
        background: #222a35;
        border: 1px solid #3a4658;
        box-shadow: 0 4px 10px #0006;
        flex: 0 0 auto;
        transition:
          transform 0.08s,
          box-shadow 0.12s;
        user-select: none;
      }
      .card .art {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center top;
      }
      .card .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0000 35%, #000c 100%);
      }
      .card.role-aggro {
        border-color: #7a2f2d;
      }
      .card.role-control {
        border-color: #2d557a;
      }
      .card.role-midrange {
        border-color: #2d7a49;
      }
      .card .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        opacity: 0.16;
      }
      .card .cost {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffe29a, #c98f1c);
        color: #241a05;
        font-weight: 800;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 6px #000a;
      }
      .card .nm {
        position: absolute;
        top: 2px;
        right: 4px;
        left: 32px;
        font-size: 9.5px;
        line-height: 1.05;
        text-align: right;
        text-shadow: 0 1px 2px #000;
      }
      .card .txt {
        position: absolute;
        left: 5px;
        right: 5px;
        bottom: 20px;
        font-size: 8.5px;
        line-height: 1.15;
        color: #dfe7ef;
        text-shadow: 0 1px 2px #000;
      }
      .card .kw {
        position: absolute;
        bottom: 20px;
        left: 5px;
        display: flex;
        gap: 3px;
      }
      .badge {
        font-size: 8px;
        font-weight: 800;
        padding: 1px 4px;
        border-radius: 4px;
        background: #000a;
        border: 1px solid #ffffff2a;
        letter-spacing: 0.5px;
      }
      .b-G {
        color: #ffd27a;
      }
      .b-R {
        color: #ff9d6b;
      }
      .b-B {
        color: #8fd0ff;
      }
      .b-D {
        color: #c58bff;
      }
      .card .stat {
        position: absolute;
        bottom: 2px;
        width: 22px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
        border-radius: 5px;
        text-shadow: 0 1px 2px #000;
      }
      .card .atk {
        left: 3px;
        color: #ffd27a;
      }
      .card .hp {
        right: 3px;
        color: #ff8f8a;
      }
      .card .hp.hurt {
        color: var(--bad);
      }
      .card.spell .stat {
        display: none;
      }
      .card.playable {
        cursor: pointer;
      }
      .card.playable:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 20px #000a;
        border-color: var(--amber);
      }
      .card.unplayable {
        filter: grayscale(0.6) brightness(0.7);
      }
      .card.canattack {
        cursor: pointer;
        box-shadow:
          0 0 0 2px var(--good),
          0 4px 10px #0006;
      }
      .card.canattack:hover {
        transform: translateY(-6px);
      }
      .card.targetable {
        cursor: crosshair;
        box-shadow:
          0 0 0 2px var(--bad),
          0 0 14px #ff6b6b88;
        animation: pulse 1.1s infinite;
      }
      .card.selected {
        box-shadow:
          0 0 0 3px var(--amber),
          0 0 16px #f4b740aa;
        transform: translateY(-8px);
      }
      @keyframes pulse {
        50% {
          filter: brightness(1.25);
        }
      }

      /* hand */
      .hand {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 8px 12px 12px;
        min-height: 172px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .handcard {
        width: 112px;
        height: 158px;
      }

      /* right log */
      .stage {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .log {
        width: 210px;
        border-left: 1px solid var(--line);
        background: #0b0e13;
        padding: 10px;
        overflow: auto;
        font-size: 12px;
        color: var(--dim);
      }
      .log h4 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 1px;
      }
      .log .line {
        padding: 3px 0;
        border-bottom: 1px dashed #1c2530;
      }
      .log .line.new {
        color: var(--amber);
      }

      .msgbar {
        text-align: center;
        padding: 5px;
        color: var(--dim);
        font-size: 13px;
        min-height: 24px;
      }
      .msgbar.err {
        color: var(--bad);
      }
      .cancel {
        color: var(--amber);
        font-weight: 700;
        cursor: pointer;
      }

      /* overlay */
      .overlay {
        position: fixed;
        inset: 0;
        background: #000b;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        z-index: 50;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay h1 {
        font-size: 52px;
        margin: 0;
        letter-spacing: 2px;
      }
      .win {
        color: var(--good);
      }
      .lose {
        color: var(--bad);
      }
      .setup {
        background: #141a22;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 34px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        min-width: 320px;
      }
      .setup .rowsel {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
        max-width: 340px;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <span class="brand">◆ SPARK</span>
        <span id="turnTag" class="meta"></span>
        <span style="margin-left: auto"></span>
        <button class="btn" onclick="openSetup()">New Game</button>
      </div>

      <!-- opponent -->
      <div class="strip">
        <div class="who">
          <span class="life"
            ><span class="heart">♥</span><span id="foeLife">–</span></span
          >
          <span class="arch" id="foeArch"></span>
        </div>
        <div class="pips" id="foePips"></div>
        <div class="meta" id="foeMeta"></div>
        <div class="face foe" id="foeFace">🎯 opponent</div>
      </div>

      <div class="stage">
        <div class="main">
          <div class="board">
            <div class="row" id="foeBoard"></div>
            <div class="divider">▲ opponent · you ▼</div>
            <div class="row" id="meBoard"></div>
          </div>
          <div class="msgbar" id="msg"></div>
          <div class="hand" id="meHand"></div>
        </div>
        <div class="log">
          <h4>BATTLE LOG</h4>
          <div id="logList"></div>
        </div>
      </div>

      <!-- you -->
      <div class="strip">
        <div class="who">
          <span class="life"
            ><span class="heart">♥</span><span id="meLife">–</span></span
          >
          <span class="arch" id="meArch"></span>
        </div>
        <div class="pips" id="mePips"></div>
        <div class="meta" id="meMeta"></div>
        <button class="btn" id="tokenBtn" onclick="useToken()">
          Spark Token
        </button>
        <button class="btn primary" id="endBtn" onclick="endTurn()">
          End Turn ⏭
        </button>
      </div>
    </div>

    <!-- winner / setup overlay -->
    <div class="overlay" id="overlay">
      <div id="overContent"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let STATE = null;
      let PENDING = null; // {action:'play'|'attack', index, kind}
      let lastLogLen = 0;

      async function api(path, body) {
        const r = await fetch(path, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        return r.json();
      }

      function glyphFor(c) {
        if (c.type === "spell") return "✦";
        if (c.keywords && c.keywords.includes("guard")) return "🛡";
        if (c.keywords && c.keywords.includes("rush")) return "⚡";
        return "⚔";
      }
      function kwBadges(c) {
        const map = { guard: "G", rush: "R", barrier: "B", drain: "D" };
        const ks = (c.keywords || []).filter((k) => map[k]);
        if (c.barrier && !ks.includes("barrier")) ks.push("barrier");
        return ks
          .map((k) => `<span class="badge b-${map[k]}">${map[k]}</span>`)
          .join("");
      }

      function cardHTML(c, opts = {}) {
        const role = c.role || "midrange";
        const artLayer = c.art
          ? `<div class="art" style="background-image:url('${c.art}')"></div><div class="veil"></div>`
          : `<div class="glyph">${glyphFor(c)}</div>`;
        const nm = `<div class="nm">${c.name}</div>`;
        const cost = `<div class="cost">${c.cost}</div>`;
        const kw = `<div class="kw">${kwBadges(c)}</div>`;
        let stats = "";
        if (c.type !== "spell") {
          const hurt =
            c.maxHealth != null && c.health < c.maxHealth ? "hurt" : "";
          stats = `<div class="stat atk">${c.atk}</div><div class="stat hp ${hurt}">${c.health}</div>`;
        }
        const txt = c.text ? `<div class="txt">${c.text}</div>` : "";
        const cls = [
          "card",
          "role-" + role,
          c.type === "spell" ? "spell" : "unit",
          opts.cls || "",
        ].join(" ");
        return `<div class="${cls}" ${opts.attrs || ""}>${artLayer}${cost}${nm}${txt}${kw}${stats}</div>`;
      }

      function pips(cur, max) {
        let h = "";
        for (let i = 0; i < Math.max(max, 0); i++)
          h += `<span class="pip ${i < cur ? "on" : ""}"></span>`;
        return h;
      }

      function render() {
        const s = STATE;
        if (!s || !s.started) return;
        const me = s.me,
          foe = s.foe;
        // faces
        $("foeLife").textContent = foe.life;
        $("meLife").textContent = me.life;
        $("foeArch").textContent = foe.arch;
        $("foeArch").className = "arch " + foe.arch;
        $("meArch").textContent = me.arch;
        $("meArch").className = "arch " + me.arch;
        $("foePips").innerHTML = pips(foe.sparkMax, foe.sparkMax);
        $("mePips").innerHTML = pips(me.spark, me.sparkMax);
        $("foeMeta").innerHTML =
          `spark ${foe.sparkMax} · hand ${foe.handCount} · deck ${foe.deck}` +
          (foe.token ? " · 🔆token" : "");
        $("meMeta").innerHTML =
          `spark ${me.spark}/${me.sparkMax} · deck ${me.deck}` +
          (me.fatigue ? ` · ⚠fatigue ${me.fatigue}` : "");
        $("turnTag").textContent = s.winner
          ? "game over"
          : s.active === "human"
            ? "YOUR TURN"
            : "opponent";

        // boards
        $("foeBoard").className = "row" + (foe.board.length ? "" : " empty");
        $("foeBoard").innerHTML = foe.board
          .map((u, i) => cardHTML(u, { attrs: `data-enemy="${i}"` }))
          .join("");
        $("meBoard").className = "row" + (me.board.length ? "" : " empty");
        $("meBoard").innerHTML = me.board
          .map((u, i) => {
            const cls = u.canAttack ? "canattack" : "";
            return cardHTML(u, { cls, attrs: `data-mine="${i}"` });
          })
          .join("");

        // hand
        $("meHand").innerHTML = me.hand
          .map((c) => {
            const cls = "handcard " + (c.playable ? "playable" : "unplayable");
            return cardHTML(c, { cls, attrs: `data-hand="${c.index}"` });
          })
          .join("");

        // controls
        $("tokenBtn").disabled = !(
          me.token &&
          s.active === "human" &&
          !s.winner
        );
        $("endBtn").disabled = !(s.active === "human" && !s.winner);
        $("tokenBtn").style.display = me.token ? "" : "none";

        // message
        const mb = $("msg");
        mb.className = "msgbar" + (s.error ? " err" : "");
        mb.innerHTML = PENDING
          ? `<span>Select a target… </span><span class="cancel" onclick="cancelPending()">cancel ✕</span>`
          : s.error || s.message || "";

        // log
        const list = $("logList");
        list.innerHTML = s.log
          .map(
            (l, i) =>
              `<div class="line ${i >= lastLogLen - 999 && false ? "" : ""}">${l}</div>`,
          )
          .join("");
        list.scrollTop = list.scrollHeight;

        attachHandlers();
        applyTargeting();
        if (s.winner) showWinner(s.winner);
      }

      function attachHandlers() {
        document.querySelectorAll("[data-hand]").forEach((el) => {
          el.onclick = () => onHand(parseInt(el.dataset.hand));
        });
        document.querySelectorAll("[data-mine]").forEach((el) => {
          el.onclick = (e) => {
            if (
              PENDING &&
              PENDING.action === "play" &&
              PENDING.kind === "friendly"
            ) {
              e.stopPropagation();
              chooseTarget({
                kind: "friendly",
                index: parseInt(el.dataset.mine),
              });
            } else onMine(parseInt(el.dataset.mine));
          };
        });
        document.querySelectorAll("[data-enemy]").forEach((el) => {
          el.onclick = (e) => {
            e.stopPropagation();
            onEnemy(parseInt(el.dataset.enemy));
          };
        });
        $("foeFace").onclick = () => {
          if (PENDING) chooseTarget({ kind: "face" });
        };
      }

      /* ---- interaction ---- */
      function onHand(i) {
        const c = STATE.me.hand.find((x) => x.index === i);
        if (!c || !c.playable) {
          flash("Can't play that now.");
          return;
        }
        if (!c.needsTarget) {
          doPlay(i, null);
          return;
        }
        PENDING = { action: "play", index: i, kind: c.needsTarget };
        render();
      }
      function onMine(i) {
        const u = STATE.me.board[i];
        if (!u || !u.canAttack) {
          flash("That unit can't attack.");
          return;
        }
        PENDING = { action: "attack", index: i, kind: "attackTarget" };
        render();
      }
      function onEnemy(i) {
        if (!PENDING) return;
        if (PENDING.action === "attack")
          chooseTarget({ kind: "enemy", index: i });
        else if (PENDING.kind === "enemy" || PENDING.kind === "flexible")
          chooseTarget({ kind: "enemy", index: i });
      }
      function chooseTarget(spec) {
        const p = PENDING;
        PENDING = null;
        if (p.action === "play") doPlay(p.index, spec);
        else doAttack(p.index, spec);
      }
      function cancelPending() {
        PENDING = null;
        render();
      }

      async function doPlay(i, target) {
        STATE = await api("/api/play", { index: i, target });
        afterAction();
      }
      async function doAttack(i, target) {
        STATE = await api("/api/attack", { index: i, target });
        afterAction();
      }
      async function useToken() {
        STATE = await api("/api/token", {});
        afterAction();
      }
      async function endTurn() {
        PENDING = null;
        $("endBtn").disabled = true;
        $("turnTag").textContent = "opponent…";
        lastLogLen = STATE ? STATE.log.length : 0;
        STATE = await api("/api/end", {});
        afterAction();
      }
      function afterAction() {
        lastLogLen = STATE.log.length;
        render();
      }
      function flash(m) {
        const mb = $("msg");
        mb.className = "msgbar err";
        mb.textContent = m;
      }

      /* ---- targeting highlight ---- */
      function applyTargeting() {
        document
          .querySelectorAll(".targetable,.selected")
          .forEach((e) => e.classList.remove("targetable", "selected"));
        $("foeFace").classList.remove("targetable");
        if (!PENDING) return;
        const s = STATE;
        if (PENDING.action === "play") {
          if (PENDING.kind === "enemy" || PENDING.kind === "flexible")
            s.foe.board.forEach((u, i) => mark(`[data-enemy="${i}"]`));
          if (PENDING.kind === "flexible")
            $("foeFace").classList.add("targetable");
          if (PENDING.kind === "friendly")
            s.me.board.forEach((u, i) => mark(`[data-mine="${i}"]`));
          mark(`[data-hand="${PENDING.index}"]`, "selected");
        } else {
          // attack
          const hasGuard = s.foe.board.some((u) => u.guard);
          s.foe.board.forEach((u, i) => {
            if (!hasGuard || u.guard) mark(`[data-enemy="${i}"]`);
          });
          if (!hasGuard && s.faceAttackable)
            $("foeFace").classList.add("targetable");
          mark(`[data-mine="${PENDING.index}"]`, "selected");
        }
      }
      function mark(sel, cls = "targetable") {
        const e = document.querySelector(sel);
        if (e) e.classList.add(cls);
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") cancelPending();
      });

      /* ---- overlays ---- */
      function showWinner(w) {
        const t =
          w === "human"
            ? ["YOU WIN", "win"]
            : w === "bot"
              ? ["DEFEAT", "lose"]
              : ["DRAW", "win"];
        $("overContent").innerHTML = `<h1 class="${t[1]}">${t[0]}</h1>
           <div class="hint">${w === "human" ? "The " + STATE.foe.arch + " bot falls." : w === "bot" ? "The " + STATE.foe.arch + " bot got you." : "Both fell."}
             You: ${STATE.me.life} ♥ &nbsp; Opponent: ${STATE.foe.life} ♥</div>
           <button class="btn primary" onclick="openSetup()">Play Again</button>`;
        $("overlay").classList.remove("hidden");
      }
      function openSetup() {
        const opts = ["aggro", "midrange", "control"];
        const sel = (id, def) =>
          `<select id="${id}">` +
          opts
            .map((o) => `<option ${o === def ? "selected" : ""}>${o}</option>`)
            .join("") +
          `</select>`;
        $("overContent").innerHTML = `<div class="setup">
             <h1 style="font-size:34px" class="win">◆ SPARK</h1>
             <div class="rowsel"><label>Your deck</label>${sel("selHuman", "aggro")}</div>
             <div class="rowsel"><label>Opponent</label>${sel("selBot", "control")}</div>
             <button class="btn primary" onclick="startGame()">Start</button>
             <div class="hint">Click a card to play it; cards needing a target will ask.
               Click one of your ⚡-lit units then an enemy (or their 🎯 face) to attack.
               Guard must be cleared first. First player is decided by coin flip.</div>
           </div>`;
        $("overlay").classList.remove("hidden");
      }
      async function startGame() {
        const human = $("selHuman").value,
          bot = $("selBot").value;
        STATE = await api("/api/new", { human, bot });
        lastLogLen = STATE.log.length;
        $("overlay").classList.add("hidden");
        PENDING = null;
        render();
      }

      /* boot */
      (async () => {
        STATE = await api("/api/state");
        if (STATE.started) {
          render();
        } else {
          openSetup();
        }
      })();
    </script>
  </body>
</html>
